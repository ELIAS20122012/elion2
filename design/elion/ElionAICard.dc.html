<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.__resources={"https://unpkg.com/react@18.3.1/umd/react.production.min.js":"vendor/react.production.min.js","https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js":"vendor/react-dom.production.min.js"};</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&amp;family=Manrope:wght@400;500;600&amp;display=swap"></link></helmet>
<section ref="{{ rootRef }}" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}" style="position:relative;width:100%;height:100%;box-sizing:border-box;container-type:inline-size;overflow:hidden;border-radius:16px;background:#070d10;border:1px solid rgba(233,215,176,.16);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 20px 60px -20px rgba(0,0,0,.8);font-family:Manrope,sans-serif;color:#cfd6d4">
  <img ref="{{ imgRef }}" src="assets/face.png" alt="" style="position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;object-position:52% 40%;will-change:transform;transform-origin:52% 45%;filter:saturate(.55) sepia(.25) brightness(.9) contrast(1.05)"></img>
  <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen"></canvas>
  <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(7,13,16,.92) 0%,rgba(7,13,16,.55) 26%,transparent 44%,transparent 72%,rgba(7,13,16,.6) 100%)"></div>
  <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 52% 45%,transparent 50%,rgba(4,8,10,.75) 100%)"></div>

    <div style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:4.4cqw;letter-spacing:.14em;color:#e9d7b0">ELION AI</div>
    <div style="font-size:2.05cqw;line-height:1.45;letter-spacing:.06em;color:#c8cfcd">MARKET INTELLIGENCE<br>REAL PERSPECTIVE<br>DISCIPLINED EXECUTION</div>
  </div>

  <div style="position:absolute;left:4.2cqw;top:32cqw;display:flex;flex-direction:column;gap:3cqw">
    <div style="position:absolute;left:1cqw;top:1.5cqw;bottom:6.5cqw;width:1px;background:rgba(233,215,176,.25)"></div>
    <div style="position:absolute;left:1cqw;top:1.5cqw;width:1px;height:{{ lineH }};background:#e9d7b0;transition:height .6s ease"></div>

      <div style="position:relative;display:flex;align-items:flex-start;gap:3.2cqw">
        <div style="width:2.1cqw;height:2.1cqw;border-radius:50%;box-sizing:border-box;margin-top:.2cqw;border:1px solid rgba(233,215,176,.6);background:{{ s.dot }};box-shadow:{{ s.glow }};transition:all .4s"></div>
        <div style="font-size:2.05cqw;line-height:1.35;letter-spacing:.06em;color:{{ s.color }};transition:color .4s">{{ s.a }}<br>{{ s.b }}</div>
      </div>
    </sc-for>
  </div>

  <div style="position:absolute;left:4.5cqw;bottom:4.5cqw;font-size:2.05cqw;line-height:1.45;letter-spacing:.06em;color:#aeb7b5">HUMAN DISCIPLINE<br>ARTIFICIAL INTELLIGENCE<br>A SHARPER TOMORROW</div>

  <div style="position:absolute;right:5cqw;top:36cqw;display:flex;flex-direction:column;gap:3cqw">
    <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:3.3cqw;line-height:1.3;color:#e9d7b0">“Same<br>Charts.<br>A Smarter<br>You.”</div>
    <div style="width:5.5cqw;height:1px;background:rgba(233,215,176,.5)"></div>
  </div>

  <div style="position:absolute;right:1.6cqw;bottom:2.4cqw;display:flex;align-items:center;gap:2cqw;padding:1.4cqw 2.4cqw 1.4cqw 1.4cqw;border-radius:3cqw;background:rgba(8,16,19,.78);border:1px solid rgba(233,215,176,.35);backdrop-filter:blur(6px)">
    <div style="width:7cqw;height:7cqw;border-radius:50%;border:1px solid rgba(233,215,176,.25);display:grid;place-items:center;background:rgba(20,32,36,.8)">
      <canvas ref="{{ waveRef }}" style="width:5cqw;height:3cqw"></canvas>
    </div>
    <div style="font-size:1.75cqw;color:#dfe4e2;min-width:24cqw">{{ status }}</div>
    <div style="font-size:2.8cqw;color:#e9d7b0;line-height:1">→</div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:445},&quot;intensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.2,&quot;max&quot;:1.6,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;},&quot;stepSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2.4,&quot;min&quot;:1,&quot;max&quot;:6,&quot;step&quot;:0.2,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;parallax&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { step: 0, si: 0 };
  mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  steps = [['SCANNING', 'MARKETS'], ['ANALYZING', 'PATTERNS'], ['DETECTING', 'OPPORTUNITIES'], ['VALIDATING', 'SETUPS']];
  statuses = ['Scanning XAUUSD, M5…', 'Analyzing market structure…', 'Detecting liquidity zones…', 'Validating setup…'];
  rootRef = el => { if (el) this.rootEl = el; };
  imgRef = el => { if (el) this.imgEl = el; };
  waveRef = el => { if (el) this.waveEl = el; };
  canvasRef = el => { if (el && el !== this.canvasEl) { this.canvasEl = el; setTimeout(() => this.trySetup(), 0); } };
  componentDidMount() {
    setTimeout(() => this.trySetup(), 0);
    this.iv = setInterval(() => this.setState(s => ({ step: (s.step + 1) % 4, si: (s.si + 1) % 4 })), (this.props.stepSeconds ?? 2.4) * 1000);
  }
  componentWillUnmount() { clearInterval(this.iv); cancelAnimationFrame(this.raf); clearTimeout(this.raf); this.ro && this.ro.disconnect(); }
  trySetup() {
    const c = this.canvasEl;
    if (!c) { setTimeout(() => this.trySetup(), 50); return; }
    if (this.activeCanvas === c) return;
    this.imgEl = this.imgEl && this.imgEl.isConnected ? this.imgEl : c.parentElement.querySelector('img');
    this.rootEl = this.rootEl && this.rootEl.isConnected ? this.rootEl : c.parentElement;
    cancelAnimationFrame(this.raf); clearTimeout(this.raf);
    this.activeCanvas = c;
    try { this.setup(c); } catch (e) { console.error('Motion setup failed', e); }
  }
  setup(c) {
    const ctx = c.getContext('2d');
    const IW = 1536, IH = 1024;
    let W = 0, H = 0, dpr, map;
    const resize = () => {
      dpr = Math.min(devicePixelRatio || 1, 2);
      W = c.clientWidth; H = c.clientHeight; c.width = W * dpr; c.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const rnd = (a, b) => a + Math.random() * (b - a);
    const nodes = Array.from({ length: 34 }, () => ({ x: rnd(450, 1150), y: rnd(0, IH), vx: rnd(-.12, .12), vy: rnd(-.12, .12), p: rnd(0, 6.28) }));
    const stars = [[830, 238, 1], [558, 478, .6], [1068, 145, .7], [715, 350, .4]].map(([x, y, r]) => ({ x, y, r, p: rnd(0, 6.28) }));
    const glyphs = '01ABCDEF{}[]<>#$%&*+=/|';
    const cols = Array.from({ length: 24 }, (_, i) => ({ x: 800 + i * 14, y: rnd(-IH, IH), v: rnd(35, 95), len: Math.floor(rnd(6, 16)), gold: Math.random() < .7 }));
    const t0 = performance.now(); let last = t0;
    const next = f => document.hidden ? setTimeout(() => f(performance.now()), 50) : requestAnimationFrame(f);
    const frame = now => {
      if (c.clientWidth && (c.clientWidth !== W || c.clientHeight !== H)) resize();
      const t = (now - t0) / 1000, dt = Math.min((now - last) / 1000, .05); last = now;
      const k = this.props.intensity ?? 1;
      const m = this.mouse; m.x += (m.tx - m.x) * .05; m.y += (m.ty - m.y) * .05;
      if (this.imgEl) this.imgEl.style.transform = `translate(${m.x * -10}px,${m.y * -7}px) scale(${1 + .03 * Math.sin(t * .2)})`;
      if (W) {
        ctx.clearRect(0, 0, W, H);
        ctx.save(); ctx.translate(m.x * -18, m.y * -12);
        ctx.lineWidth = .5;
        for (const n of nodes) { n.x += n.vx; n.y += n.vy; if (n.x < 450 || n.x > 1150) n.vx *= -1; if (n.y < 0 || n.y > IH) n.vy *= -1; }
        for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 170) { const [x1, y1] = P(a.x, a.y), [x2, y2] = P(b.x, b.y); ctx.strokeStyle = `rgba(233,215,176,${(1 - d / 170) * .18 * k})`; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
        }
        for (const n of nodes) { const [x, y] = P(n.x, n.y); ctx.fillStyle = `rgba(240,225,190,${(.4 + .4 * Math.sin(t * 2 + n.p)) * k})`; ctx.beginPath(); ctx.arc(x, y, 1.1, 0, 7); ctx.fill(); }
        const fs = Math.max(8, 11 * map.s); ctx.font = `${fs}px ui-monospace,monospace`; ctx.textAlign = 'center';
        for (const col of cols) {
          col.y += col.v * dt; if (col.y - col.len * 14 > IH) { col.y = rnd(-200, 0); col.gold = Math.random() < .7; }
          for (let q = 0; q < col.len; q++) {
            const gy = col.y - q * 14; if (gy < 0 || gy > IH) continue;
            const [x, y] = P(col.x, gy), a = (1 - q / col.len) * .7 * k;
            ctx.fillStyle = q === 0 ? `rgba(255,245,225,${a})` : col.gold ? `rgba(225,195,140,${a})` : `rgba(110,190,180,${a})`;
            ctx.fillText(glyphs[(Math.floor(t * 8 + q * 7 + col.x)) % glyphs.length], x, y);
          }
        }
        for (const s of stars) {
          const [x, y] = P(s.x, s.y), f = (.5 + .5 * Math.sin(t * 1.5 + s.p)) * k, r = 34 * s.r * map.s;
          const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(255,215,150,${f * .9})`); g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
        }
        const sy = ((t * .1) % 1.3 - .15) * H; const g = ctx.createLinearGradient(0, sy - 50, 0, sy + 50);
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, `rgba(233,215,176,${.08 * k})`); g.addColorStop(1, 'rgba(0,0,0,0)');

        ctx.restore();
      }
      const w = this.waveEl;

        const ww = w.clientWidth, wh = w.clientHeight;
        if (w.width !== ww * 2) { w.width = ww * 2; w.height = wh * 2; }
        const x2 = w.getContext('2d'); x2.setTransform(2, 0, 0, 2, 0, 0); x2.clearRect(0, 0, ww, wh);
        x2.strokeStyle = '#e9d7b0'; x2.lineWidth = 1; x2.beginPath();
        for (let i = 0; i <= ww; i++) {

          const y = wh / 2 + env * wh * .42 * Math.sin(u * 22 + t * 7) * (.6 + .4 * Math.sin(u * 5 - t * 3));
          i ? x2.lineTo(i, y) : x2.moveTo(i, y);
        }
        x2.stroke();
      }
      this.raf = next(frame);
    };
    frame(performance.now());
  }
  renderVals() {
    const cur = this.state.step;
    return {
      rootRef: this.rootRef, imgRef: this.imgRef, canvasRef: this.canvasRef, waveRef: this.waveRef,
      status: this.statuses[this.state.si],
      lineH: `${cur * 8.4}cqw`,
      steps: this.steps.map(([a, b], i) => ({
        a, b,
        dot: i === cur ? '#e9d7b0' : i < cur ? 'rgba(233,215,176,.45)' : '#0b1417',
        glow: i === cur ? '0 0 1.6cqw rgba(233,215,176,.7)' : 'none',
        color: i === cur ? '#f3e6c8' : i < cur ? '#c8cfcd' : '#8e9896'
      })),
      onMove: e => { if (!(this.props.parallax ?? true)) return; const r = (this.rootEl || e.currentTarget).getBoundingClientRect(); this.mouse.tx = (e.clientX - r.left) / r.width - .5; this.mouse.ty = (e.clientY - r.top) / r.height - .5; },
      onLeave: () => { this.mouse.tx = 0; this.mouse.ty = 0; }
    };
  }
}
</script>
