@layer base {
  html, body {
    width: 100vw;
    margin: 0;
    padding: 0;
    font-family: 'Vazirmatn', sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    overscroll-behavior: none;
    background-color: #f0ede6;
    color: #273240;
    min-height: max(884px, 100dvh);
  }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom, 12px); }
  .pt-safe { padding-top: env(safe-area-inset-top, 12px); }
}

::-webkit-scrollbar { display: none; }

/* Enhanced Soft Neumorphic Utilities */
.neu-raised {
  background: #f0ede6;
  box-shadow: 6px 6px 14px rgba(206, 201, 192, 0.75), -6px -6px 14px rgba(255, 255, 255, 0.95);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.neu-raised-sm {
  background: #f0ede6;
  box-shadow: 3px 3px 8px rgba(206, 201, 192, 0.7), -3px -3px 8px rgba(255, 255, 255, 0.95);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.neu-pressed {
  background: #ebe7df;
  box-shadow: inset 4px 4px 8px rgba(200, 194, 184, 0.8), inset -4px -4px 8px rgba(255, 255, 255, 0.9);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.neu-pressed-sm {
  background: #ece8e0;
  box-shadow: inset 2px 2px 5px rgba(200, 194, 184, 0.75), inset -2px -2px 5px rgba(255, 255, 255, 0.9);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.neu-dock {
  background: rgba(240, 237, 230, 0.92);
  box-shadow: 0 16px 32px rgba(190, 183, 172, 0.35), -4px -4px 16px rgba(255, 255, 255, 0.8);
}

/* Dynamic Live Bar Animations */
@keyframes barGrow {
  0% { transform: scaleY(0.1); opacity: 0.3; }
  100% { transform: scaleY(1); opacity: 1; }
}

.bar-anim {
  transform-origin: bottom;
  animation: barGrow 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.interactive-neu:active {
  box-shadow: inset 3px 3px 7px rgba(195, 189, 179, 0.8), inset -3px -3px 7px rgba(255, 255, 255, 0.9) !important;
  transform: scale(0.96);
}

/* Material symbols refined */
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 450, 'GRAD' 0, 'opsz' 24;
  transition: transform 0.25s ease, color 0.25s ease;
}
.material-symbols-outlined.filled {
  font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
}
