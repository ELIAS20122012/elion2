<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ece8e1">
  <title>Daily Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
  <style>
/* Design tokens: warm neumorphic palette. Dark mode swaps the same variables via html.dark. */
:root {
  --bg: #ece8e1;
  --card: #fcf9f3;
  --well: #efebe1;
  --canvas: #f7f4ee;
  --text: #1e293b;
  --muted: #64748b;
  --line: #e3ddd1;
  --accent: #de8353;
  --accent-soft: rgba(222, 131, 83, .16);
  --sage: #8eaa97;
  --sage-text: #4d7c62;
  --lav: #6b6f9c;
  --danger: #c2410c;
  --on-accent: #fff;

  --sh-raised: -4px -4px 10px #fff, 5px 5px 12px rgba(180, 172, 160, .55);
  --sh-raised-sm: -2px -2px 6px #fff, 3px 3px 8px rgba(180, 172, 160, .45);
  --sh-inset: inset 3px 3px 7px rgba(180, 172, 160, .55), inset -3px -3px 7px #fff;
  --sh-inset-sm: inset 2px 2px 4px rgba(180, 172, 160, .5), inset -2px -2px 4px #fff;
  --sh-sheet: 0 -10px 40px rgba(60, 50, 40, .18);

  --r-card: 28px;
  --r-md: 20px;
  --r-sm: 14px;
  --gutter: 20px;
  --font: 'Vazirmatn', Tahoma, sans-serif;
}

html.dark {
  --bg: #1b1b19;
  --card: #272723;
  --well: #1f1f1c;
  --canvas: #1d1d1a;
  --text: #ece8e1;
  --muted: #a3a8b3;
  --line: #3b3b36;
  --accent-soft: rgba(222, 131, 83, .22);
  --sage-text: #8eaa97;
  --lav: #a3a7d6;
  --danger: #f0a37a;

  --sh-raised: -3px -3px 8px rgba(255, 255, 255, .035), 5px 5px 12px rgba(0, 0, 0, .5);
  --sh-raised-sm: -2px -2px 5px rgba(255, 255, 255, .03), 3px 3px 8px rgba(0, 0, 0, .45);
  --sh-inset: inset 3px 3px 7px rgba(0, 0, 0, .5), inset -2px -2px 5px rgba(255, 255, 255, .04);
  --sh-inset-sm: inset 2px 2px 4px rgba(0, 0, 0, .5), inset -1px -1px 3px rgba(255, 255, 255, .04);
  --sh-sheet: 0 -10px 40px rgba(0, 0, 0, .5);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.6 var(--font); }
body {
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  overflow-x: clip;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
::-webkit-scrollbar { display: none; }

.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal; font-style: normal; font-size: 22px; line-height: 1;
  letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr;
  display: inline-block; flex: none; width: 1em; overflow: hidden;
  -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga';
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  user-select: none;
}
.material-symbols-outlined.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.material-symbols-outlined.tiny { font-size: 14px; vertical-align: middle; }

/* ---- shell: a centred phone-width column ---- */
body { max-width: 430px; margin: 0 auto; box-shadow: 0 0 0 1px rgba(0, 0, 0, .04), 0 20px 60px rgba(60, 50, 40, .12); }
@media (min-width: 560px) { html { background: #ddd8ce; } html.dark { background: #111110; } }

#header {
  position: fixed; top: 0; z-index: 50; width: 100%; max-width: 430px;
  padding-top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: 0 1px 8px rgba(0, 0, 0, .04);
}
.header-bar { height: 64px; padding: 0 var(--gutter); display: flex; align-items: center; justify-content: space-between; }
.header-bar h1 { font-size: 18px; font-weight: 700; }
.avatar {
  position: relative; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; background: #091426; color: #fff;
}
html.dark .avatar { background: #bcc7de; color: #111c2d; }
.avatar .material-symbols-outlined { font-size: 19px; }
.avatar i { position: absolute; top: -2px; right: -2px; width: 11px; height: 11px; border-radius: 50%; background: var(--sage); border: 2px solid var(--bg); }

#app { padding: calc(72px + env(safe-area-inset-top, 0px)) var(--gutter) 116px; }
.view { display: flex; flex-direction: column; gap: 16px; animation: view-in .22s ease; }
@keyframes view-in { from { opacity: 0; transform: translateY(6px); } }

#nav {
  position: fixed; bottom: 0; z-index: 60; width: 100%; max-width: 430px;
  display: flex; justify-content: center; pointer-events: none;
  padding: 0 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
#nav .dock {
  pointer-events: auto; width: 100%; max-width: 384px; height: 64px; padding: 0 10px;
  display: flex; align-items: center; justify-content: space-around; border-radius: 999px;
  background: color-mix(in srgb, var(--card) 95%, transparent);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: -6px -6px 16px #fff, 7px 7px 18px rgba(180, 172, 160, .6);
}
html.dark #nav .dock { box-shadow: 0 8px 24px rgba(0, 0, 0, .45); }
#nav a {
  width: 48px; height: 48px; border-radius: 999px; display: grid; place-items: center;
  color: #8a8478; text-decoration: none; transition: transform .15s, color .15s;
}
html.dark #nav a { color: #a9a69e; }
#nav a:active { transform: scale(.94); }
#nav a[aria-current="page"] { color: var(--accent); box-shadow: var(--sh-inset-sm); }
#nav a .material-symbols-outlined { font-size: 24px; }

/* ---- layout helpers ---- */
.row { display: flex; align-items: center; gap: 8px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.col { display: flex; flex-direction: column; min-width: 0; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }
.stack-xs { display: flex; flex-direction: column; gap: 6px; }
.grid2, .grid3, .grid4, .grid7 { display: grid; gap: 12px; }
.grid2 { grid-template-columns: repeat(2, 1fr); }
.grid3 { grid-template-columns: repeat(3, 1fr); }
.grid4 { grid-template-columns: repeat(4, 1fr); }
.grid7 { grid-template-columns: repeat(7, 1fr); gap: 6px; }
.gap-sm { gap: 10px; }
.gap-xs { gap: 6px; }
.center { text-align: center; }
.block { display: block; }
.wide { width: 100%; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.ltr { direction: ltr; unicode-bidi: plaintext; }
.pad { padding: 12px; }

/* ---- text ---- */
.muted { color: var(--muted); }
.small { font-size: 12px; }
.tiny { font-size: 10.5px; }
small { font-size: 11px; }
.bold { font-weight: 700; }
.big { font-size: 22px; font-weight: 800; }
.hero { font-size: 40px; font-weight: 800; line-height: 1.1; }
.t-head { font-size: 16px; font-weight: 700; }
.strike { text-decoration: line-through; }
.faded { opacity: .5; }
.pos { color: var(--sage-text); }
.neg { color: var(--danger); }
.accent { color: var(--accent); }
.sage { color: var(--sage); }
.sage-text { color: var(--sage-text); }
.lav { color: var(--lav); }
.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 14px 0; }
.well.empty { padding: 18px; border-radius: var(--r-md); }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .35; } }

/* ---- toast ---- */
#toast {
  position: fixed; z-index: 9999; bottom: 92px; left: 50%; transform: translate(-50%, 8px);
  max-width: calc(100% - 40px); padding: 11px 16px; border-radius: var(--r-md);
  background: #1e293b; color: #fff; font-weight: 600; font-size: 13px; line-height: 1.5;
  box-shadow: 0 8px 20px rgba(0, 0, 0, .25); display: flex; gap: 10px; align-items: center;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
#toast button { color: #fdb885; font-weight: 700; }
html.dark #toast { background: #ece8e1; color: #1b1b19; }
html.dark #toast button { color: #865228; }

/* ---- bottom sheets ---- */
.overlay { position: fixed; inset: 0; z-index: 9000; display: flex; align-items: flex-end; justify-content: center; background: rgba(20, 22, 28, .38); opacity: 0; transition: opacity .2s; }
.overlay.open { opacity: 1; }
.sheet {
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
  padding: 10px 20px calc(22px + env(safe-area-inset-bottom, 0px));
  background: var(--card); color: var(--text); border-radius: 28px 28px 0 0; box-shadow: var(--sh-sheet);
  transform: translateY(30px); transition: transform .22s;
}
.overlay.open .sheet { transform: none; }
.sheet-grip { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 2px auto 12px; }
.sheet h3 { margin: 0 0 4px; font-size: 17px; font-weight: 800; }
.sheet-sub { margin: 0 0 12px; font-size: 12px; color: var(--muted); line-height: 1.8; }
.sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
.grid2 > *, .grid3 > *, .grid4 > *, .grid7 > *, .row > *, .row-between > * { min-width: 0; }

/* ---- surfaces ---- */
.card { background: var(--card); border-radius: var(--r-card); padding: 20px; box-shadow: var(--sh-raised); }
.card-sm { background: var(--card); border-radius: var(--r-md); padding: 12px; box-shadow: var(--sh-raised-sm); }
.well { background: var(--well); border-radius: var(--r-sm); box-shadow: var(--sh-inset-sm); }
.well.chart-well, .well.drop, .well.budget { border-radius: var(--r-md); box-shadow: var(--sh-inset); }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-title { display: flex; align-items: center; gap: 8px; font-weight: 700; text-align: start; }
.chip-icon { width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center; background: var(--well); }
.chip-icon .material-symbols-outlined { font-size: 17px; }
.chip-icon.accent { color: var(--accent); } .chip-icon.sage { color: var(--sage); }
.link { font-size: 11.5px; font-weight: 600; padding: 2px 4px; border-radius: 8px; }
.link.center { display: block; width: 100%; text-align: center; padding: 8px; font-size: 13px; font-weight: 700; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--card); box-shadow: var(--sh-raised-sm); font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill .material-symbols-outlined { font-size: 18px; }
.pill.well { box-shadow: var(--sh-inset); background: var(--well); }
.pill.accent { color: var(--accent); }
.pill.sage { background: color-mix(in srgb, var(--sage) 25%, transparent); box-shadow: none; padding: 2px 10px; font-size: 11px; color: var(--text); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; background: var(--well); color: var(--muted); white-space: nowrap; }
.tag.sage { color: var(--sage-text); } .tag.accent { background: var(--accent-soft); color: var(--accent); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
.dot.sage { background: var(--sage); } .dot.accent { background: var(--accent); } .dot.lav { background: #b6b2d8; } .dot.none { background: transparent; }
.dot.pulse { animation: pulse 1.6s ease-in-out infinite; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--sage) 30%, transparent); color: var(--text); }
.badge-red { background: var(--accent); color: #fff; }

/* ---- buttons ---- */
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--card); color: var(--muted); box-shadow: var(--sh-raised); transition: transform .12s, color .12s;
}
.icon-btn:hover { color: var(--text); }
.icon-btn:active { transform: scale(.93); box-shadow: var(--sh-inset-sm); }
.icon-btn.sm { width: 38px; height: 38px; box-shadow: var(--sh-raised-sm); }
.icon-btn.sm .material-symbols-outlined { font-size: 20px; }
.icon-btn.xs { width: 32px; height: 32px; box-shadow: var(--sh-raised-sm); }
.icon-btn.xs .material-symbols-outlined { font-size: 18px; }
.icon-btn.flat { box-shadow: none; background: none; }
.icon-btn.accent { color: var(--accent); } .icon-btn.sage { color: var(--sage); }
.icon-btn.primary { background: var(--accent); color: #fff; }
.icon-btn.static { pointer-events: none; }
.icon-btn.disabled { opacity: .35; pointer-events: none; }

.btn {
  flex: 1; padding: 13px; border-radius: 16px; font-weight: 700; font-size: 14px; text-align: center;
  background: var(--well); color: var(--text); border: 1px solid var(--line);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.sage { background: var(--sage); border-color: var(--sage); color: #fff; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; }

.btn-add {
  width: 100%; padding: 12px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--card); box-shadow: var(--sh-raised-sm); color: var(--accent); font-weight: 700; font-size: 14px;
}
.btn-add:active { transform: scale(.98); box-shadow: var(--sh-inset-sm); }
.btn-add .material-symbols-outlined { font-size: 20px; }
.btn-add.sage { color: var(--sage-text); } .btn-add.muted { color: var(--muted); }
.mini-btn {
  padding: 7px 12px; border-radius: 12px; background: var(--card); box-shadow: var(--sh-raised-sm);
  font-size: 12px; font-weight: 700; color: var(--text); text-align: center; white-space: nowrap;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.mini-btn.row { flex-direction: row; justify-content: center; gap: 6px; }
.mini-btn.wide { width: 100%; padding: 11px; }
.mini-btn.accent { color: var(--accent); } .mini-btn.muted { color: var(--muted); }
.mini-btn:active { transform: scale(.96); }
.mini-btn .material-symbols-outlined { font-size: 18px; }
.grid4 .mini-btn { font-size: 10px; padding: 8px 4px; }
.fab {
  position: fixed; z-index: 55; bottom: 92px; inset-inline-start: calc(50% - 215px + 20px); width: 54px; height: 54px; border-radius: 50%;
  display: grid; place-items: center; background: var(--accent); color: #fff; box-shadow: 0 10px 22px rgba(222, 131, 83, .45);
}
@media (max-width: 430px) { .fab { inset-inline-start: 20px; } }
.fab .material-symbols-outlined { font-size: 28px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; gap: 5px; align-items: center; padding: 8px 13px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--well); color: var(--text); font-weight: 600; font-size: 13px;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip .material-symbols-outlined { font-size: 17px; }
select.chip { appearance: none; padding-inline-end: 13px; }

.toggle { width: 52px; height: 28px; border-radius: 999px; padding: 3px; background: var(--well); box-shadow: var(--sh-inset-sm); position: relative; flex: none; }
.toggle i { display: block; width: 22px; height: 22px; border-radius: 50%; background: var(--card); box-shadow: var(--sh-raised-sm); transition: transform .25s, background .25s; transform: translateX(0); }
.toggle.on i { background: var(--sage); transform: translateX(-24px); }

.seg-control { display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: var(--well); box-shadow: var(--sh-inset); }
.seg-control button { flex: 1; padding: 8px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--muted); text-align: center; display: grid; place-items: center; }
.seg-control button.on { background: var(--card); color: var(--text); box-shadow: var(--sh-raised-sm); }
.seg-control.sm button { padding: 4px 10px; } .seg-control.sm .material-symbols-outlined { font-size: 16px; }

.check-circle { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--well); box-shadow: inset 0 0 0 2px var(--prio, var(--muted)); color: #fff; }
.check-circle .material-symbols-outlined { font-size: 16px; opacity: 0; }
.check-circle.on { background: var(--sage); box-shadow: none; }
.check-circle.on .material-symbols-outlined { opacity: 1; }
.check-square { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--card); color: var(--muted); box-shadow: var(--sh-raised-sm); }
.check-square .material-symbols-outlined { font-size: 20px; opacity: .3; }
.check-square.on { background: var(--sage); color: #fff; box-shadow: var(--sh-inset-sm); }
.check-square.on .material-symbols-outlined, .check-square.part .material-symbols-outlined { opacity: 1; }
.check-square.part { color: var(--accent); }
.check-square.sm { width: 32px; height: 32px; border-radius: 10px; } .check-square.sm .material-symbols-outlined { font-size: 18px; }

/* ---- forms ---- */
.field { display: block; margin: 10px 0; }
.field > span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.input {
  width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--well); color: var(--text); font: 500 15px var(--font); outline: none; direction: rtl;
}
.input:focus { border-color: var(--accent); }
.input-ltr { direction: ltr; text-align: right; }
textarea.input { min-height: 110px; resize: vertical; line-height: 1.8; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.switch { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; font-size: 14px; font-weight: 600; cursor: pointer; }
.switch i { width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.switch i::after { content: ''; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
.switch.on i { background: var(--sage); }
.switch.on i::after { transform: translateX(-18px); }

/* ---- sheet content ---- */
.menu { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 6px; border-radius: var(--r-sm); font-weight: 600; font-size: 15px; }
.menu button:hover { background: var(--well); }
.menu button .material-symbols-outlined { font-size: 22px; color: var(--muted); }
.menu button.danger, .menu button.danger .material-symbols-outlined { color: var(--danger); }
.list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--well); border-radius: var(--r-sm); font-size: 14px; }
.item[role="button"] { cursor: pointer; }
.item-block { display: block; }
.item-icon { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--card); flex: none; color: var(--muted); }
.item-icon .material-symbols-outlined { font-size: 19px; }
.item-icon.num { font-weight: 800; font-size: 13px; color: var(--text); }
.item-title { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-sub { display: block; font-size: 11.5px; color: var(--muted); }
.amt { direction: ltr; font-weight: 800; white-space: nowrap; }
.group-label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 12px 4px 2px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.stat-grid > div, .stat { background: var(--well); border-radius: var(--r-sm); padding: 10px 12px; box-shadow: var(--sh-inset-sm); }
.stat-grid small, .stat small { display: block; color: var(--muted); font-size: 11px; }
.stat-grid b { font-size: 16px; } .stat b { font-size: 15px; }

.progress { display: block; height: 8px; border-radius: 9px; background: color-mix(in srgb, var(--muted) 22%, transparent); overflow: hidden; margin-top: 6px; }

/* Optional host capabilities (e.g. image understanding when embedded in a Claude artifact).
   Outside such a host every call resolves to null / rejects with { code: 'unavailable' }. */
function cap(name) {
  const candidates = [window, window.parent !== window ? window.parent : null];
  for (const w of candidates) {
    try {
      if (w && w.claude && w.claude.use) return w.claude.use(name).catch(() => null);
    } catch { /* cross-origin parent */ }
  }
  return Promise.resolve(null);
}

async function askVision(file, prompt) {
  const sample = await cap('sample');
  if (!sample) throw { code: 'unavailable' };
  const limits = sample.limits ? await sample.limits().catch(() => null) : null;
  if (!limits || !limits.images) throw { code: 'images_unavailable' };
  return sample.json(prompt, { images: [file], modelTier: 'default' });
}

  input.style.display = 'none';

function shrinkImage(file, max, cb) {
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * k);
    canvas.height = Math.round(img.height * k);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    cb(canvas.toDataURL('image/jpeg', 0.7));

      fin.saveTx(t, { type, amount, category: v.category, note: (v.note || '').trim(), date: v.date, accountId: v.acc || (t && t.accountId) || fin.defAcc() });
      commit();
      toast(t ? 'تراکنش ویرایش شد' : type === 'income' ? 'دریافتی ثبت شد' : 'هزینه ثبت شد');
      if (!t && type === 'expense') budgetCheck();
    },
  });
}

function transferSheet(t) {
  if (S.accounts.length < 2) { toast('برای انتقال، حداقل دو حساب لازم است'); accountSheet(); return; }
  form({
    title: t ? 'ویرایش انتقال' : 'انتقال بین حساب‌ها',
    sub: 'انتقال روی مجموع موجودی، درآمد و هزینه اثری ندارد.',
    fields: [
      { name: 'amount', label: `مبلغ (${S.profile.currency})`, type: 'number', value: t ? t.amount : '' },
      { name: 'from', label: 'از حساب', type: 'chips', value: t ? t.accountId : S.accounts[0].id, options: accOptions() },
      { name: 'to', label: 'به حساب', type: 'chips', value: t ? t.toAccountId : S.accounts[1].id, options: accOptions() },
      { name: 'note', label: 'توضیح', value: t ? t.note : '', placeholder: 'اختیاری' },
      { name: 'date', label: 'تاریخ', type: 'date', value: t ? t.date : today() },
    ],
    extra: t ? [{ label: 'حذف', cls: 'danger', run: () => removeTx(t.id) }] : [],
    onSubmit(v) {
      const amount = needPositive(v.amount);
      if (!amount) return false;
      if (v.from === v.to) { toast('حساب مبدأ و مقصد یکی است'); return false; }
      fin.saveTransfer(t, { amount, from: v.from, to: v.to, note: (v.note || '').trim(), date: v.date });
      commit();
      toast('انتقال ثبت شد');
    },
  });
}

function removeTx(id) {
  const undo = fin.deleteTx(id);
  if (!undo) return;
  commit();
  toast(undo.unlinked ? 'تراکنش حذف و پرداخت لغو شد' : 'تراکنش حذف شد', { label: 'واگرد', run: () => { fin.restoreTx(undo); commit(); } });
}

function budgetCheck() {
  if (!S.wallet.alerts) return;
  const used = fin.budgetUsed();
  if (used >= 1) setTimeout(() => toast('هشدار: از بودجه این ماه عبور کردید'), 2500);
  else if (used >= 0.8) setTimeout(() => toast(`هشدار: ${fa(Math.round(used * 100))}٪ بودجه ماه مصرف شده`), 2500);
}

function newTxMenu() {
  menu('ثبت جدید', [
    { icon: 'arrow_upward', label: 'هزینه', run: () => txSheet('expense') },
    { icon: 'arrow_downward', label: 'دریافتی / درآمد', run: () => txSheet('income') },
    { icon: 'swap_horiz', label: 'انتقال بین حساب‌ها', run: () => transferSheet() },
    { icon: 'event_repeat', label: 'قسط / وام جدید', run: () => loanSheet() },
    { icon: 'receipt_long', label: 'قبض یا پرداخت دوره‌ای جدید', run: () => billSheet() },
    { icon: 'account_balance', label: 'حساب یا کارت جدید', run: () => accountSheet() },
  ]);
}

/* ---------- ledger lists ---------- */
function txRowsHtml(list) {
  if (!list.length) return '<div class="empty">تراکنشی ثبت نشده</div>';
  return `<div class="list">${list.map((t) => {
    const c = fin.catOf(t.category);
    const cls = t.type === 'income' ? 'pos' : t.type === 'expense' ? 'neg' : '';
    const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '−' : '⇄ ';
    const where = S.accounts.length > 1 && t.type !== 'transfer' ? ` • ${esc(fin.accName(fin.txAccount(t)))}` : '';
    return `<div class="item" data-pick="${t.id}" role="button">
      <span class="item-icon"><span class="material-symbols-outlined">${t.type === 'transfer' ? 'swap_horiz' : c.icon}</span></span>
      <span class="grow"><span class="item-title">${esc(t.note || c.label)}</span><span class="item-sub">${esc(fin.txLabel(t))} • ${faDayMonth(parseIso(t.date))}${where}</span></span>
      <b class="amt ${cls}">${sign}${M(t.amount)}</b></div>`;
  }).join('')}</div>`;
}

function historySheet(filter, title = 'همه تراکنش‌ها') {
  const list = fin.sortedTx(filter ? S.tx.filter(filter) : S.tx);
  const groups = new Map();
  list.forEach((t) => { const k = monthKey(t.date); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); });
  let html = '';
  groups.forEach((rows, k) => { html += `<div class="group-label">${monthLabel(k)}</div>${txRowsHtml(rows)}`; });
  if (!html) html = '<div class="empty">تراکنشی ثبت نشده</div>';
  infoSheet(title, `<p class="sheet-sub">برای ویرایش یا حذف، روی تراکنش بزنید.</p>${html}`,
    [{ label: 'تراکنش جدید', cls: 'primary', run: newTxMenu }],
    (el, close) => { close(); later(() => txSheet(null, {}, el.dataset.pick)); });
}

/* ---------- reports ---------- */
function reportSheet() {
  const mk = currentMonthKey();
  const inc = fin.monthSum('income');
  const exp = fin.monthSum('expense');
  const prev = fin.monthSum('expense', prevMonthKey());
  const diff = prev ? Math.round(((exp - prev) / prev) * 100) : null;
  const debt = fin.loansRemaining();
  const due30 = fin.dueItems(30).reduce((s, d) => s + d.amount, 0);
  const by = fin.expenseByCategory(mk);
  const cats = Object.keys(by).sort((a, b) => by[b] - by[a]);
  const flow = fin.cashFlow(6);
  const top = Math.max(1, ...flow.flatMap((r) => [r.income, r.expense]));
  const tile = (label, value, cls = '') => `<div><small>${label}</small><b class="${cls}">${value}</b></div>`;

  let html = `<p class="sheet-sub">${monthLabel(mk)}</p><div class="stat-grid">
    ${tile('درآمد این ماه', M(inc), 'pos')}${tile('هزینه این ماه', M(exp), 'neg')}${tile('خالص این ماه', M(inc - exp))}
    ${tile('هزینه نسبت به ماه قبل', diff == null ? '—' : `${diff > 0 ? '+' : ''}${fa(diff)}٪`)}
    ${tile('بدهی باقی‌مانده اقساط', M(debt), 'neg')}${tile('دارایی خالص', M(fin.balance() - debt))}
    ${tile('پرداختنی ۳۰ روز آینده', M(due30))}${tile('بودجه باقی‌مانده', M(Math.max(0, S.wallet.budget - exp)))}</div>`;

  html += '<div class="group-label">جریان نقدی ۶ ماه اخیر</div><div class="list">';
  html += flow.map((r) => `<div class="item item-block">
    <div class="row-between small"><b>${monthLabel(r.key)}</b><span><span class="pos">+${M(r.income)}</span> / <span class="neg">−${M(r.expense)}</span></span></div>
    <span class="progress"><i style="width:${Math.round((r.income / top) * 100)}%;background:var(--sage)"></i></span>
    <span class="progress"><i style="width:${Math.round((r.expense / top) * 100)}%"></i></span></div>`).join('');
  html += '</div><div class="group-label">هزینه این ماه بر اساس دسته</div>';
  html += cats.length
    ? cats.map((k) => {
      const c = fin.catOf(k);
      const pct = Math.round((by[k] / exp) * 100);
      return `<div class="item"><span class="item-icon"><span class="material-symbols-outlined">${c.icon}</span></span>
        <span class="grow"><span class="item-title">${c.label} <span class="item-sub">${fa(pct)}٪</span></span><span class="progress"><i style="width:${pct}%"></i></span></span>
        <b class="amt">${M(by[k])}</b></div>`;
    }).join('')
    : '<div class="empty">هنوز هزینه‌ای در این ماه ثبت نشده</div>';

  const onWallet = currentRoute() === 'wallet';
  infoSheet('گزارش مالی', html, onWallet
    ? [{ label: 'خروجی اکسل (CSV)', run: () => exportCsv(S.tx, 'all') }, { label: 'تنظیم بودجه', run: budgetSheet }]
    : [{ label: 'کیف پول', cls: 'primary', run: () => go('wallet') }]);
}

function budgetSheet() {
  form({
    title: 'بودجه ماهانه', sub: `هزینه این ماه: ${M(fin.monthSum('expense'))}`,
    fields: [
      { name: 'b', label: `سقف هزینه ماهانه (${S.profile.currency})`, type: 'number', value: S.wallet.budget },
      { name: 'alerts', label: 'هشدار نزدیک شدن به سقف بودجه', type: 'switch', value: S.wallet.alerts },
    ],
    onSubmit(v) {
      const b = num(v.b);
      if (b <= 0) { toast('مبلغ معتبر وارد کنید'); return false; }
      S.wallet.budget = b;
      S.wallet.alerts = !!v.alerts;
      commit();
      toast('بودجه به‌روزرسانی شد');
    },
  });
}

function exportCsv(list, tag) {
  const q = (x) => { x = String(x == null ? '' : x); return /[",\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x; };
  const rows = [['تاریخ میلادی', 'تاریخ شمسی', 'نوع', 'دسته', 'توضیح', 'حساب', 'به حساب', 'مبلغ', 'واحد']];
  list.slice().sort((a, b) => (a.date < b.date ? -1 : 1)).forEach((t) => {
    rows.push([t.date, jalaliString(t.date), t.type === 'income' ? 'درآمد' : t.type === 'expense' ? 'هزینه' : 'انتقال', fin.catOf(t.category).label, t.note,
      fin.accName(fin.txAccount(t)), t.type === 'transfer' ? fin.accName(t.toAccountId) : '', t.type === 'expense' ? -t.amount : t.amount, S.profile.currency]);
  });
  saveFile(`ledger-${tag}-${today()}.csv`, `﻿${rows.map((r) => r.map(q).join(',')).join('\r\n')}`, 'text/csv');
}

/* ---------- paying installments & bills ---------- */
function payDialog(it, done) {
  const isLoan = it.kind === 'loan';
  const ref = it.ref;
  const fields = [
    { name: 'amount', label: `مبلغ پرداختی (${S.profile.currency})`, type: 'number', value: it.amount },
    { name: 'date', label: 'تاریخ پرداخت', type: 'date', value: today() },
  ];
  if (S.accounts.length > 1) fields.push({ name: 'acc', label: 'پرداخت از حساب', type: 'chips', value: ref.accountId || fin.defAcc(), options: accOptions() });
  fields.push({ name: 'record', label: 'ثبت به‌عنوان هزینه در حساب‌ها', type: 'switch', value: true });
  form({
    title: isLoan ? `پرداخت قسط ${fa(it.n)} — ${ref.title}` : `پرداخت ${ref.title}`,
    sub: `سررسید: ${fullDate(it.due)} (${relDay(it.due)})`,
    fields, submit: 'ثبت پرداخت',
    onSubmit(v) {
      const amount = needPositive(v.amount);
      if (!amount) return false;
      const left = fin.payObligation(it, { amount, date: v.date, accountId: v.acc, record: v.record });
      commit();
      toast(isLoan ? (left ? `قسط ثبت شد — ${fa(left)} قسط باقی‌مانده` : `🎉 همه اقساط «${ref.title}» تسویه شد`) : `پرداخت «${ref.title}» ثبت شد`);
      if (done) done();
    },
  });
}

function undoPayment(ref, key) {
  const entry = ref.paid[key];
  if (!entry) return;
  confirmBox('لغو این پرداخت؟', entry.txId ? 'تراکنش هزینه مربوط هم حذف می‌شود.' : 'وضعیت به «پرداخت‌نشده» برمی‌گردد.', 'لغو پرداخت', () => {
    fin.cancelPayment(ref, key);
    commit();
    toast('پرداخت لغو شد');
  });
}

const payLoan = (l, n) => payDialog({ kind: 'loan', ref: l, n, due: fin.loanDue(l, n), amount: l.amount });
const payBill = (b) => { const nx = fin.billNext(b); payDialog({ kind: 'bill', ref: b, due: nx.due, amount: Math.round(fin.billAvg(b) * 100) / 100 }); };

/* ---------- loans ---------- */
function loanSheet(id) {
  const l = id ? S.loans.find((x) => x.id === id) : null;
  const fields = [
    { name: 'title', label: 'عنوان', value: l ? l.title : '', placeholder: 'مثلاً وام خودرو، اقساط گوشی' },
    { name: 'lender', label: 'وام‌دهنده / فروشنده', value: l ? l.lender : '', placeholder: 'اختیاری' },
    { name: 'amount', label: 'مبلغ هر قسط', type: 'number', value: l ? l.amount : '', row: 'a' },
    { name: 'count', label: 'تعداد اقساط', type: 'number', value: l ? l.count : 12, row: 'a' },
    { name: 'start', label: 'سررسید قسط اول', type: 'date', value: l ? l.start : addMonthsIso(today(), 1) },
    { name: 'every', label: 'فاصله اقساط', type: 'chips', value: String(l ? l.every || 1 : 1), options: [{ value: '1', label: 'ماهانه' }, { value: '2', label: 'دوماهه' }, { value: '3', label: 'سه‌ماهه' }] },
    { name: 'paidBefore', label: 'تعداد اقساطی که قبلاً پرداخت شده', type: 'number', value: l ? '' : 0, placeholder: l ? 'بدون تغییر' : '0' },
  ];
  if (S.accounts.length > 1) fields.push({ name: 'acc', label: 'پرداخت معمولاً از حساب', type: 'chips', value: l ? l.accountId || fin.defAcc() : fin.defAcc(), options: accOptions() });
  fields.push({ name: 'remind', label: 'یادآوری سررسید (یک روز قبل)', type: 'switch', value: l ? l.remind !== false : true });
  form({
    title: l ? 'ویرایش قسط' : 'ثبت قسط / وام جدید',
    sub: `روز سررسید هر ماه بر اساس تقویم ${useJ() ? 'شمسی' : 'میلادی'} تکرار می‌شود.`,
    fields, focus: !l,
    extra: l ? [{ label: 'حذف', cls: 'danger', run: () => confirmDeleteLoan(l) }] : [],
    onSubmit(v) {
      const title = (v.title || '').trim();
      const amount = num(v.amount);
      const count = Math.round(num(v.count));
      if (!title) { toast('عنوان را وارد کنید'); return false; }
      if (amount <= 0) { toast('مبلغ قسط را وارد کنید'); return false; }
      if (count < 1 || count > 600) { toast('تعداد اقساط معتبر نیست'); return false; }
      fin.saveLoan(l, { title, lender: (v.lender || '').trim(), amount, count, start: v.start || today(), every: +v.every || 1, accountId: v.acc, remind: !!v.remind, paidBefore: Math.round(num(v.paidBefore)) });
      commit();
      toast(l ? 'قسط ویرایش شد' : `قسط «${title}» ثبت شد`);
    },
  });
}

function confirmDeleteLoan(l) {
  const linked = S.tx.filter((t) => t.loanId === l.id).length;
  confirmBox(`حذف «${l.title}»؟`, linked ? `${fa(linked)} تراکنش پرداخت‌شده در دفتر باقی می‌ماند.` : 'برنامه اقساط حذف می‌شود.', 'حذف', () => {
    fin.deleteLoan(l);
    commit();
    toast('حذف شد');
  });
}

function loanSchedule(l) {
  const tile = (label, value, cls = '') => `<div><small>${label}</small><b class="${cls}">${value}</b></div>`;
  let html = `<div class="stat-grid">${tile('پرداخت‌شده', `${fa(fin.loanPaidCount(l))} از ${fa(l.count)}`)}${tile('مانده بدهی', M(fin.loanRemaining(l)), 'neg')}${tile('مبلغ کل', M(l.amount * l.count))}${tile('آخرین سررسید', monthYear(fin.loanDue(l, l.count)))}</div><div class="list">`;
  for (let n = 1; n <= l.count; n++) {
    const due = fin.loanDue(l, n);
    const p = l.paid[n];
    const over = !p && due < today();
    const state = p ? `پرداخت شد${p.before ? ' (قبل از ثبت)' : ` • ${faDayMonth(parseIso(p.date))}`}` : over ? `معوق — ${relDay(due)}` : relDay(due);
    html += `<div class="item" data-pick="${n}" role="button"><span class="item-icon num">${fa(n)}</span>
      <span class="grow"><span class="item-title">${fullDate(due)}</span><span class="item-sub${over ? ' neg' : ''}">${state}</span></span>
      <b class="amt${p ? ' pos' : ''}">${p ? (p.settled ? 'تسویه ✓' : `✓ ${M(p.amount)}`) : M(l.amount)}</b></div>`;
  }
  infoSheet(l.title, `${html}</div>`, [{ label: 'ویرایش', run: () => loanSheet(l.id) }], (el, close) => {
    const n = +el.dataset.pick;
    close();
    later(() => (l.paid[n] ? undoPayment(l, n) : payLoan(l, n)));
  });
}

function loanMenu(l) {
  const nx = fin.loanNextN(l);
  menu(l.title, [
    nx && { icon: 'payments', label: `پرداخت قسط ${fa(nx)} (${fullDate(fin.loanDue(l, nx))})`, run: () => payLoan(l, nx) },
    { icon: 'calendar_month', label: 'جدول کامل اقساط', run: () => loanSchedule(l) },
    nx && { icon: 'done_all', label: 'تسویه کامل (پرداخت همه اقساط باقی‌مانده)', run: () => settleSheet(l) },
    { icon: 'edit', label: 'ویرایش', run: () => loanSheet(l.id) },
    { icon: 'delete', label: 'حذف', danger: true, run: () => confirmDeleteLoan(l) },
  ], `${l.lender ? `${l.lender} • ` : ''}مانده: ${M(fin.loanRemaining(l))}`);
}

function settleSheet(l) {
  const rem = fin.loanRemaining(l);
  form({
    title: `تسویه کامل ${l.title}`,
    sub: `${fa(l.count - fin.loanPaidCount(l))} قسط باقی‌مانده به مبلغ ${M(rem)}. اگر تخفیف تسویه گرفته‌اید مبلغ را اصلاح کنید.`,
    fields: [{ name: 'amount', label: 'مبلغ پرداختی', type: 'number', value: rem }, { name: 'date', label: 'تاریخ', type: 'date', value: today() }],
    submit: 'تسویه',
    onSubmit(v) {
      const amount = num(v.amount);
      if (amount <= 0) { toast('مبلغ را وارد کنید'); return false; }
      fin.settleLoan(l, amount, v.date);
      commit();
      toast(`🎉 «${l.title}» تسویه شد`);
    },
  });
}

/* ---------- bills ---------- */
function billSheet(id) {
  const b = id ? S.bills.find((x) => x.id === id) : null;
  const autoTitle = (kind) => `قبض ${fin.BILL_KINDS[kind].label}`;
  const fields = [
    {
      name: 'kind', label: 'نوع', type: 'chips', value: b ? b.kind : 'electricity',
      options: Object.entries(fin.BILL_KINDS).map(([k, v]) => ({ value: k, label: v.label, icon: v.icon })),
      onChange(kind, f) {
        const input = f.querySelector('input[name=title]');
        const isAuto = Object.keys(fin.BILL_KINDS).some((k) => input && input.value === autoTitle(k));
        if (input && (!input.value || isAuto)) { input.value = autoTitle(kind); input.dispatchEvent(new Event('input')); }
      },
    },
    { name: 'title', label: 'عنوان', value: b ? b.title : 'قبض برق' },
    { name: 'amount', label: 'مبلغ تقریبی هر دوره', type: 'number', value: b ? b.amount : '', row: 'a' },
    { name: 'start', label: 'سررسید بعدی', type: 'date', value: b ? b.start : addMonthsIso(today(), 0), row: 'a' },
    { name: 'every', label: 'دوره پرداخت', type: 'chips', value: String(b ? b.every || 1 : 1), options: Object.entries(fin.EVERY).map(([k, label]) => ({ value: k, label })) },
  ];
  if (S.accounts.length > 1) fields.push({ name: 'acc', label: 'پرداخت معمولاً از حساب', type: 'chips', value: b ? b.accountId || fin.defAcc() : fin.defAcc(), options: accOptions() });
  fields.push({ name: 'remind', label: 'یادآوری سررسید (یک روز قبل)', type: 'switch', value: b ? b.remind !== false : true });
  form({
    title: b ? 'ویرایش قبض' : 'قبض یا پرداخت دوره‌ای جدید',
    sub: 'مثل برق، گاز، اینترنت، اجاره، بیمه یا اشتراک‌ها.', fields, focus: false,
    extra: b ? [{ label: 'حذف', cls: 'danger', run: () => confirmDeleteBill(b) }] : [],
    onSubmit(v) {
      const title = (v.title || '').trim();
      if (!title) { toast('عنوان را وارد کنید'); return false; }
      fin.saveBill(b, { kind: v.kind, title, amount: num(v.amount), every: +v.every || 1, start: v.start || today(), accountId: v.acc, remind: !!v.remind });
      commit();
      toast(b ? 'قبض ویرایش شد' : `«${title}» ثبت شد`);
    },
  });
}

function confirmDeleteBill(b) {
  confirmBox(`حذف «${b.title}»؟`, 'تراکنش‌های پرداخت‌شده در دفتر باقی می‌مانند.', 'حذف', () => { fin.deleteBill(b); commit(); toast('حذف شد'); });
}

function billMenu(b) {
  const nx = fin.billNext(b);
  menu(b.title, [
    nx && { icon: 'payments', label: `پرداخت دوره ${monthName(nx.due)} (${relDay(nx.due)})`, run: () => payBill(b) },
    { icon: 'history', label: 'سابقه پرداخت‌ها', run: () => billHistory(b) },

/* Accordion "hub": a column of icon cards of which at most one is open (used by Tasks and Wallet).
   Open section and nested group state persist in S.ui. */
const { S, commit } = __r("src/core/store.js");
const { chev, badge, icon } = __r("src/ui/widgets.js");
const { scrollToCard } = __r("src/ui/dom.js");

const openKey = (name, def = '') => (S.ui.open[name] === undefined ? def : S.ui.open[name]);
const setOpen = (name, key) => { S.ui.open[name] = key; commit(); };

/** sections: [{ key, title, icon, color, sum, badge?, body() }] — body() runs only for the open one. */
function hubHtml(name, sections, def = '') {
  const open = openKey(name, def);
  return sections.map((s) => {
    const on = open === s.key;
    return `<div class="hub-card${on ? ' is-open' : ''}" data-sec="${s.key}">
      <button class="hub-head" data-act="hub" data-hub="${name}" data-section="${s.key}">
        <span class="hub-icon" style="color:${s.color}">${icon(s.icon)}</span>
        <span class="hub-text"><span class="hub-title">${s.title}${s.badge || ''}</span><span class="hub-sum">${s.sum}</span></span>
        ${chev(on)}
      </button>
      ${on ? `<div class="hub-body">${s.body()}</div>` : ''}
    </div>`;
  }).join('');
}

/** Collapsible sub-group inside a hub body. */
function group({ id, title, count = 0, inner, def = false, red = false, extra = '' }) {
  const on = S.ui.sub[id] === undefined ? def : S.ui.sub[id];
  return `<div class="group">
    <button class="group-head" data-act="sub" data-id="${id}" data-def="${def ? 1 : 0}">
      <span class="group-title${red ? ' neg' : ''}">${title}${badge(count, red)}</span>
      <span class="group-extra">${extra}${chev(on)}</span>
    </button>
    ${on ? `<div class="group-body">${inner}</div>` : ''}
  </div>`;
}

/** Click handlers for data-act="hub" / "sub". Spread into a page's `act` map. */
const hubActions = {
  hub(el) {
    const { hub, section: key } = el.dataset;
    const next = openKey(hub) === key ? '' : key;
    setOpen(hub, next);
    if (next) scrollToCard(document.querySelector(`[data-sec="${key}"]`));
  },
  sub(el) {
    const { id, def } = el.dataset;
    const cur = S.ui.sub[id] === undefined ? def === '1' : S.ui.sub[id];
    S.ui.sub[id] = !cur;
    commit();
  },
};

__exports.openKey = openKey;
__exports.setOpen = setOpen;
__exports.hubHtml = hubHtml;
__exports.group = group;
__exports.hubActions = hubActions;
};

  paintClocks();
}

function show() {
  const id = currentRoute();
  if (!ROUTES.includes(id)) { go('dashboard'); return; }
  clearInterval(tickTimer);
  page = PAGES[id];
  view = document.createElement('div');
  view.className = `view page-${id}`;
  $('#app').replaceChildren(view);
  bindActions(view, page);
  $('#title').textContent = page.title;
  document.title = `${page.title} · Daily Order`;
  document.querySelectorAll('#nav a').forEach((a) => {
    if (a.dataset.route === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (page.mount) page.mount();
  render();
  window.scrollTo(0, 0);
  if (page.tick) tickTimer = setInterval(render, page.tick);
}

function buildNav() {
  $('#nav').innerHTML = `<div class="dock">${NAV.map(([id, ic, label]) =>
    `<a href="#/${id}" data-route="${id}" aria-label="${label}" title="${label}">${icon(ic)}</a>`).join('')}</div>`;
}

function boot() {
  init();
  applyTheme();
  buildNav();
  bindActions($('#header'), { act: { settings: openSettings, theme: toggleDark, profile: openProfile } });
  subscribe(render);
  window.addEventListener('hashchange', show);
  window.addEventListener('pageshow', (e) => { if (e.persisted) { reloadFromStorage(); applyTheme(); render(); } });
  setInterval(paintClocks, 10000);
  setInterval(checkReminders, 30000);
  show();
  checkReminders();
  window.__app = { state: () => S };
}

boot();
