<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2f4f46">
  <title>نظم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=swap">
  <style>
/* Design tokens — light cream, bone cards with soft shadow, dark green primary, light coral accent. */
:root {
  --bg: #f3ecdf;
  --card: #fbf7ee;
  --well: #eee5d4;
  --ink: #2c3a35;
  --muted: #868b80;
  --line: #e4dac7;
  --primary: #2f4f46;
  --primary-soft: #4d6f64;
  --on-primary: #f6f0e2;
  --accent: #ee9f87;
  --accent-deep: #d9805f;
  --accent-soft: #f7d9cd;
  --sage: #cfd9c9;
  --danger: #b4492f;
  --font: 'Vazirmatn', Tahoma, sans-serif;
  --r-sm: 10px; --r-md: 16px; --r-lg: 24px;
  --gutter: 20px;
  --shadow: 0 1px 2px rgba(60, 50, 30, .05), 0 8px 20px rgba(60, 50, 30, .07);
  --shadow-sm: 0 1px 2px rgba(60, 50, 30, .05), 0 3px 8px rgba(60, 50, 30, .06);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.7 var(--font); }
body { min-height: 100dvh; max-width: 430px; margin: 0 auto; -webkit-tap-highlight-color: transparent; overflow-x: clip; }
@media (min-width: 560px) { html { background: #ddd3bf; } body { box-shadow: 0 0 0 1px rgba(0, 0, 0, .05), 0 24px 60px rgba(60, 50, 30, .2); } }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
::-webkit-scrollbar { display: none; }
small { font-size: 11.5px; color: var(--muted); }

.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; display: inline-block; flex: none; width: 1em; overflow: hidden; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; font-variation-settings: 'FILL' 0, 'wght' 350, 'GRAD' 0, 'opsz' 24; user-select: none; }
.material-symbols-outlined.tiny { font-size: 15px; vertical-align: middle; }
.material-symbols-outlined.muted { color: var(--muted); }

/* top bar */
#top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 6px; background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.tb-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--primary); }
.tb-btn .material-symbols-outlined { font-size: 26px; }
.wordmark { font-size: 22px; font-weight: 800; color: var(--primary); letter-spacing: .02em; }

#app { padding: 4px var(--gutter) 130px; }
.view { display: flex; flex-direction: column; gap: 18px; animation: in .25s ease; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }

/* fixed bottom bar */
#nav { position: fixed; bottom: 0; z-index: 30; width: 100%; max-width: 430px; display: flex; background: var(--primary); padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px)); border-radius: 20px 20px 0 0; box-shadow: 0 -6px 20px rgba(40, 55, 45, .2); }
#nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: color-mix(in srgb, var(--on-primary) 55%, transparent); text-decoration: none; position: relative; }
#nav a small { color: inherit; font-size: 10.5px; font-weight: 700; }
#nav a .material-symbols-outlined { font-size: 25px; }
#nav a[aria-current="page"] { color: var(--on-primary); }
#nav a[aria-current="page"]::after { content: ''; position: absolute; top: -8px; width: 28px; height: 3px; border-radius: 3px; background: var(--accent); }

/* splash */
#splash { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--primary); color: var(--on-primary); opacity: 0; pointer-events: none; transition: opacity .6s; }
#splash.show { opacity: 1; pointer-events: auto; transition: none; }
#splash .wordmark { color: var(--on-primary); font-size: 60px; }
#splash small { font: 500 12px/1 'Cormorant Garamond', Georgia, serif; letter-spacing: .5em; color: color-mix(in srgb, var(--on-primary) 70%, transparent); padding-inline-start: .5em; }
#splash p { margin-top: 28px; font-size: 13px; color: color-mix(in srgb, var(--on-primary) 75%, transparent); }
.splash-leaf { width: 90px; opacity: .22; position: absolute; inset-inline-end: 18%; bottom: 22%; }
.loadbar { position: absolute; bottom: 9%; width: 56%; height: 2px; background: color-mix(in srgb, var(--on-primary) 20%, transparent); border-radius: 2px; overflow: hidden; }
.loadbar i { display: block; height: 100%; width: 100%; background: var(--on-primary); transform-origin: right; animation: load 1.3s ease-out forwards; }
@keyframes load { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* helpers */
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.col { display: flex; flex-direction: column; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-s { display: flex; flex-direction: column; gap: 10px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ltr { direction: ltr; unicode-bidi: plaintext; }
.center { text-align: center; }
.block { display: block; }
.end { text-align: end; }
.gap { gap: 10px; }
.neg { color: var(--danger); }
.pos { color: var(--primary-soft); }
.big { font-size: 24px; font-weight: 800; color: var(--primary); }
.t-lg { font-size: 19px; font-weight: 800; color: var(--primary); }
.small { font-size: 12px; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* toast */
#toast { position: fixed; z-index: 9999; bottom: 92px; left: 50%; transform: translate(-50%, 8px); max-width: calc(100% - 40px); padding: 11px 18px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-weight: 600; font-size: 13px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); display: flex; gap: 12px; align-items: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
#toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
#toast button { color: var(--accent); font-weight: 700; }

/* ---- text ---- */
.greet h1, .page-head h1 { font-size: 24px; font-weight: 800; color: var(--primary); line-height: 1.4; }
.greet p, .page-head p { color: var(--muted); font-size: 13px; }
.eyebrow { display: block; font-size: 12px; font-weight: 700; color: color-mix(in srgb, var(--on-primary) 72%, transparent); }
.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 22px 0; }
.link { font-size: 12.5px; font-weight: 700; color: var(--primary-soft); padding: 4px 2px; }
.link.center { display: block; width: 100%; text-align: center; padding: 8px; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; }
.sec-head h3 { font-size: 15px; font-weight: 800; }

/* ---- surfaces ---- */
.card { background: var(--card); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); }
.list { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow-sm); }
.row.wrap { flex-wrap: wrap; }
.row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: start; }
.row .col b { font-size: 14.5px; font-weight: 700; }
.row .col small { display: block; }
.row.is-done { opacity: .6; }
.row.is-done .col b { text-decoration: line-through; }
.row-ic { width: 42px; height: 42px; border-radius: 13px; flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); }
.row-ic.coral { background: var(--accent-soft); color: var(--accent-deep); }
.row-ic .material-symbols-outlined { font-size: 22px; }
.amt { font-weight: 800; white-space: nowrap; font-size: 14px; }
.mini-photo { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; flex: none; }
.chk { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1.6px solid var(--primary-soft); color: transparent; }
.chk .material-symbols-outlined { font-size: 18px; }
.chk.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.sets { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
.set { min-width: 40px; height: 34px; border-radius: 999px; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--primary); border: 1.5px solid var(--sage); }
.set.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.badge { display: inline-block; margin-inline-start: 8px; padding: 0 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; background: var(--well); color: var(--muted); }
.badge.ok { background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--primary); }
.badge.warn { background: var(--accent-soft); color: var(--accent-deep); }
.badge.bad { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }

/* ---- drawers: small text headers; the list slides down under the one you open ---- */
.drawers { display: flex; flex-direction: column; }
.drawer { border-bottom: 1px solid var(--line); }
.drawer:first-child { border-top: 1px solid var(--line); }
.drawer-head { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 14px 2px; font-size: 14.5px; font-weight: 700; color: var(--ink); }
.drawer.open .drawer-head { color: var(--primary); }
.dchev { font-size: 20px; color: var(--muted); transition: transform .2s; }
.drawer.open .dchev { transform: rotate(180deg); color: var(--primary); }
.drawer-body { padding: 2px 0 18px; animation: drop .22s ease; }
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } }

/* ---- pills ---- */
.pills { display: flex; gap: 8px; }
.pill { padding: 7px 16px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 12.5px; }
.pill.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); }

/* ---- buttons ---- */
.icon-btn { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--card); color: var(--primary); box-shadow: var(--shadow-sm); }
.icon-btn.sm { width: 34px; height: 34px; color: var(--muted); }
.icon-btn.sm.on { color: var(--accent-deep); }
.btn-sm { padding: 8px 16px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: 12.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; }
.btn-sm.live { background: var(--accent-deep); }
.btn-sm .material-symbols-outlined { font-size: 17px; }
.btn-accent { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 24px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 800; font-size: 14px; align-self: flex-start; box-shadow: 0 6px 14px rgba(217, 128, 95, .35); }
.btn-primary, .btn-ghost { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 999px; font-weight: 800; font-size: 14px; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-ghost { background: var(--card); color: var(--primary); box-shadow: inset 0 0 0 1.5px var(--primary); }
.btns { display: flex; gap: 10px; }

/* ---- forms on pages ---- */
.add-line { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 6px; padding-inline-start: 16px; background: var(--card); border-radius: 999px; box-shadow: var(--shadow-sm); }
.add-line input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 14.5px; padding: 9px 0; }
.add-line input::placeholder { color: var(--muted); }

/* ---- today ---- */
.focus { position: relative; overflow: hidden; background: var(--primary); color: var(--on-primary); border-radius: var(--r-lg); padding: 22px 20px; display: flex; flex-direction: column; gap: 6px; min-height: 190px; box-shadow: var(--shadow); }
.focus h2 { font-size: 22px; font-weight: 800; line-height: 1.5; max-width: 74%; }
.focus p { color: color-mix(in srgb, var(--on-primary) 75%, transparent); font-size: 13px; }
.focus .btn-accent { margin-top: 12px; }
.leaf { position: absolute; inset-inline-end: -4px; bottom: -6px; width: 118px; color: var(--on-primary); opacity: .17; pointer-events: none; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 6px; background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow-sm); text-align: center; min-width: 0; }
.stat .material-symbols-outlined { color: var(--accent-deep); font-size: 24px; }
.stat b { font-size: 16px; font-weight: 800; color: var(--primary); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-card { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow-sm); text-align: start; }
.note-card b { font-size: 15px; }

/* ---- calendar / week strip ---- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
.card > .week:first-child, .stack > .week { margin-top: 0; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow-sm); text-align: center; min-width: 0; }
.card .wd { background: transparent; box-shadow: none; }
.wd b { font-size: 15px; color: var(--ink); }
.wd.now b { color: var(--accent-deep); }
.wd.on { background: var(--primary); box-shadow: var(--shadow-sm); }
.wd.on small, .wd.on b { color: var(--on-primary); }
.dots { height: 7px; display: flex; gap: 3px; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
.dot.coral { background: var(--accent); } .dot.green { background: var(--primary-soft); }
.legend { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.day-card { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* ---- rings, meters, bars ---- */
.ring { position: relative; width: var(--s); height: var(--s); flex: none; display: inline-grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.rg-bg { stroke: var(--well); } .rg-fg { stroke: var(--primary); stroke-linecap: round; transition: stroke-dashoffset .4s; }
.rg-t { position: relative; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.rg-t b { font-size: calc(var(--s) * .2); font-weight: 800; color: var(--primary); }
.rg-t small { font-size: 10px; }
.meter { display: block; height: 7px; border-radius: 7px; background: var(--well); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; border-radius: 7px; background: var(--primary); transition: width .3s; }
.meter.over i { background: var(--accent-deep); }
.bars { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; height: 110px; }
.bcol { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
.bcol i { display: block; width: 100%; max-width: 20px; border-radius: 8px; background: var(--sage); }
.bcol.on i { background: var(--accent); }
.bcol small { font-size: 10px; }

/* ---- gym ---- */
.plan-card { display: flex; align-items: center; gap: 16px; }
.photo-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 24px 18px; }
.photo-card .btn-accent { align-self: center; margin-top: 6px; }
.photo-ic { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-deep); }
.photo-ic .material-symbols-outlined { font-size: 30px; }

/* ---- money ---- */
.balance-card { display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: var(--r-lg); background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow); }
.big-num { font-size: 38px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.big-num small { font-size: 16px; font-weight: 600; color: color-mix(in srgb, var(--on-primary) 70%, transparent); }
.balance-card small { color: color-mix(in srgb, var(--on-primary) 72%, transparent); }
.lines { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid color-mix(in srgb, var(--on-primary) 20%, transparent); padding-top: 12px; font-size: 13px; }
.lines div { display: flex; justify-content: space-between; }
.eye { color: color-mix(in srgb, var(--on-primary) 82%, transparent); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini { display: flex; flex-direction: column; gap: 2px; padding: 13px; background: var(--card); border-radius: var(--r-md); box-shadow: var(--shadow-sm); text-align: start; min-width: 0; }
.mini b { font-size: 17px; font-weight: 800; color: var(--primary); }
.mini.static { cursor: default; }

/* ---- bottom sheets (shared by every dialog) ---- */
.overlay { position: fixed; inset: 0; z-index: 9000; display: flex; align-items: flex-end; justify-content: center; background: rgba(32, 40, 30, .45); opacity: 0; transition: opacity .2s; }
.overlay.open { opacity: 1; }
.sheet { width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 10px 20px calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--card); color: var(--ink); border-radius: 24px 24px 0 0; transform: translateY(30px); transition: transform .22s; }
.overlay.open .sheet { transform: none; }
.sheet-grip { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 2px auto 14px; }
.sheet h3 { margin: 0 0 4px; font-size: 18px; font-weight: 800; color: var(--primary); }
.sheet-sub { margin: 0 0 12px; font-size: 12px; color: var(--muted); line-height: 1.8; }
.sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
.sheet .btn { flex: 1; background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.sheet .btn.primary { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.sheet .btn.danger { color: var(--danger); }
.field { display: block; margin: 12px 0; }
.field > span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--bg); color: var(--ink); font: 500 15px var(--font); outline: none; direction: rtl; }
.input:focus { border-color: var(--primary); }
.input-ltr { direction: ltr; text-align: right; }
textarea.input { min-height: 110px; resize: vertical; line-height: 1.8; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; gap: 5px; align-items: center; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-size: 13px; }
.chip.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.chip .material-symbols-outlined { font-size: 17px; }
.switch { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; font-size: 14px; font-weight: 600; cursor: pointer; }
.switch i { width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.switch i::after { content: ''; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch.on i { background: var(--primary); }
.switch.on i::after { transform: translateX(-18px); }
.menu { display: flex; flex-direction: column; margin-top: 6px; }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 4px; font-weight: 600; font-size: 15px; }
.menu button + button { border-top: 1px solid var(--line); }
.menu button .material-symbols-outlined { color: var(--primary-soft); }
.menu button.danger, .menu button.danger .material-symbols-outlined { color: var(--danger); }
.list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; background: var(--bg); border-radius: var(--r-md); font-size: 14px; }
.item[role="button"] { cursor: pointer; }
.item-block { display: block; }
.item-icon { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--sage) 30%, transparent); flex: none; color: var(--primary); }
.item-icon .material-symbols-outlined { font-size: 19px; }
.item-icon.num { font-weight: 800; font-size: 13px; }
.item-title { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Jalali (Persian) calendar conversion — jalaali algorithm. */
const div = (a, b) => ~~(a / b);
const mod = (a, b) => a - ~~(a / b) * b;
const BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];

function jalCal(jy) {
  const bl = BREAKS.length;
  const gy = jy + 621;
  let leapJ = -14, jp = BREAKS[0], jump = 0, jm, n, i;
  for (i = 1; i < bl; i += 1) {
    jm = BREAKS[i];
    jump = jm - jp;
    if (jy < jm) break;
    leapJ += div(jump, 33) * 8 + div(mod(jump, 33), 4);
    jp = jm;
  }
  n = jy - jp;
  leapJ += div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
  if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
  const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
  const march = 20 + leapJ - leapG;
  if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
  let leap = mod(mod(n + 1, 33) - 1, 4);
  if (leap === -1) leap = 4;
  return { leap, gy, march };
}

function g2d(gy, gm, gd) {
  const d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
  return d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
}

function d2g(jdn) {
  let j = 4 * jdn + 139361631;
  j += div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
  const i = div(mod(j, 1461), 4) * 5 + 308;
  const gd = div(mod(i, 153), 5) + 1;
  const gm = mod(div(i, 153), 12) + 1;
  const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
  return { gy, gm, gd };
}

function j2d(jy, jm, jd) {
  const r = jalCal(jy);
  return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
}

function d2j(jdn) {
  const gy = d2g(jdn).gy;

  const r = jalCal(jy);
  let k = jdn - g2d(gy, 3, r.march);

    if (k <= 185) return { jy, jm: 1 + div(k, 31), jd: mod(k, 31) + 1 };
    k -= 186;
  } else {
    jy -= 1;
    k += 179;

  }

  return jm <= 6 ? 31 : jm <= 11 ? 30 : (jalCal(jy).leap === 0 ? 30 : 29);

function toJ(isoStr) {

/** Jalali y/m/d → "YYYY-MM-DD" (Gregorian) */
function fromJ(jy, jm, jd) {

  return `${g.gy}-${String(g.gm).padStart(2, '0')}-${String(g.gd).padStart(2, '0')}`;

/* Parsing of one typed line ("نهار 120", "+حقوق 1500", "ماست ۱۲۰"). Pure — no DOM. */
const { en } = __r("src/core/format.js");

/** Split a line into its text and the LAST number in it (Persian digits and commas accepted). */
function splitAmount(line) {
  const text = en(String(line || '')).trim();
  const m = text.match(/(\d[\d,]*(?:\.\d+)?)(?!.*\d)/);
  if (!m) return { title: text, amount: 0 };
  const amount = parseFloat(m[1].replace(/,/g, ''));
  const title = (text.slice(0, m.index) + text.slice(m.index + m[1].length)).replace(/\s+/g, ' ').trim();
  return { title, amount: Number.isFinite(amount) ? amount : 0 };
}

/** "+حقوق 1500" is income, anything else an expense. */
function parseMoneyLine(line) {
  const raw = String(line || '').trim();
  const income = /^[+＋]/.test(raw);
  const { title, amount } = splitAmount(income ? raw.slice(1) : raw);
  return { type: income ? 'income' : 'expense', title, amount };
}

    const cls = t.type === 'income' ? 'pos' : t.type === 'expense' ? 'neg' : '';
    const sign = t.type === 'income' ? '+' : t.type === 'expense' ? '−' : '⇄ ';
    return `<div class="item" data-pick="${t.id}" role="button">
      <span class="item-icon"><span class="material-symbols-outlined">${c.icon}</span></span>
      <span class="grow"><span class="item-title">${esc(t.note || c.label)}</span><span class="item-sub">${esc(fin.txLabel(t))} • ${faDayMonth(parseIso(t.date))}</span></span>
      <b class="amt ${cls}">${sign}${M(t.amount)}</b></div>`;
  }).join('')}</div>`;
}

function historySheet() {

  groups.forEach((rows, k) => { html += `<div class="group-label">${monthLabel(k)}</div>${txRowsHtml(rows)}`; });

    (el, close) => { close(); later(() => txSheet(null, {}, el.dataset.pick)); });

function exportCsv(list, tag) {

    onSubmit(v) {
      const b = num(v.b);

      S.wallet.budget = b;
      commit();
    },
  });
}

function removeBudget() {

  S.wallet.budget = 0;

}

function removeCatBudget(key) {

  const custom = fin.customCats().find((c) => c.id === key);
  const label = fin.catOf(key).label;
  delete fin.catBudgets()[key];
  fin.dropCustomIfUnused(key);
  commit();

function catBudgetSheet(key) {
  const custom = key && fin.customCats().find((c) => c.id === key);

  if (!key || custom) fields.push({ name: 'name', label: 'نام دسته (هر چه می‌خواهید)', value: custom ? custom.label : '' });
  fields.push({ name: 'b', label: `سقف ماهانه (${S.profile.currency})`, type: 'number', value: key ? fin.catBudgets()[key] || '' : '' });
  form({
    title: key ? `بودجه ${fin.catOf(key).label}` : 'بودجه‌ی دسته‌ی تازه',
    fields, focus: !key,
    extra: key && fin.catBudgets()[key] ? [{ label: 'حذف', cls: 'danger', run: () => removeCatBudget(key) }] : [],
    onSubmit(v) {
      const b = num(v.b);
      if (b <= 0) { toast('سقف ماهانه را بنویسید'); return false; }

        const name = (v.name || '').trim();

    fields: [

      { name: 'amount', label: `مبلغ هر ماه (${S.profile.currency})`, type: 'number', value: m ? m.amount : '' },
    ],
    focus: !m,
    extra: m ? [{
      label: 'حذف', cls: 'danger',
      run: () => { const r = MO.removeMonthly(m.id); commit(); toast('حذف شد', { label: 'واگرد', run: () => { S.monthly.splice(r.index, 0, r.item); commit(); } }); },

      commit();
    },
  });
}
