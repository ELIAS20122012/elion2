  <style>
/* Design tokens — deep olive green on warm cream. One theme, no dark mode (fewer options). */
:root {
  --green: #3f4d3a;
  --green-deep: #2f3a2c;
  --green-soft: #5b6c55;
  --cream: #efe7d6;
  --paper: #f7f1e4;
  --line: #ddd2bb;
  --ink: #2a3226;
  --muted: #7c806f;
  --sage: #a8b39a;
  --on-green: #f1ead9;
  --danger: #a5502d;
  --font: 'Vazirmatn', Tahoma, sans-serif;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --r-lg: 20px;
  --r-md: 14px;
  --gutter: 20px;
  --shadow: 0 1px 2px rgba(47, 58, 44, .06), 0 6px 16px rgba(47, 58, 44, .06);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; background: var(--cream); color: var(--ink); font: 400 14px/1.7 var(--font); }
body { min-height: 100dvh; max-width: 430px; margin: 0 auto; -webkit-tap-highlight-color: transparent; overflow-x: clip; background: var(--cream); }
@media (min-width: 560px) { html { background: #d9cfb9; } body { box-shadow: 0 0 0 1px rgba(0, 0, 0, .05), 0 24px 60px rgba(47, 58, 44, .18); } }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
::-webkit-scrollbar { display: none; }
small { font-size: 11.5px; color: var(--muted); }

.material-symbols-outlined {
  font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1;
  letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; display: inline-block; flex: none;
  width: 1em; overflow: hidden; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga';
  font-variation-settings: 'FILL' 0, 'wght' 350, 'GRAD' 0, 'opsz' 24; user-select: none;
}
.material-symbols-outlined.tiny { font-size: 15px; vertical-align: middle; }
.material-symbols-outlined.muted { color: var(--muted); }

/* brand bar */
#brand { position: sticky; top: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) 0 8px; background: color-mix(in srgb, var(--cream) 94%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.wordmark { font-size: 22px; font-weight: 800; letter-spacing: .02em; color: var(--green); line-height: 1.2; }
#brand small { font: 500 9px/1 var(--serif); letter-spacing: .42em; color: var(--muted); margin-top: 2px; padding-inline-start: .42em; }

#app { padding: 6px var(--gutter) 108px; }
.view { display: flex; flex-direction: column; gap: 22px; animation: in .25s ease; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }

/* bottom tabs */
#nav { position: fixed; bottom: 0; z-index: 30; width: 100%; max-width: 430px; display: flex; background: var(--green); padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); border-radius: 18px 18px 0 0; box-shadow: 0 -6px 20px rgba(47, 58, 44, .18); }
#nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: color-mix(in srgb, var(--on-green) 55%, transparent); text-decoration: none; position: relative; }
#nav a small { color: inherit; font-size: 10.5px; font-weight: 600; }
#nav a .material-symbols-outlined { font-size: 25px; }
#nav a[aria-current="page"] { color: var(--on-green); }
#nav a[aria-current="page"]::after { content: ''; position: absolute; bottom: -2px; width: 18px; height: 2px; border-radius: 2px; background: var(--on-green); }

/* splash */
#splash { position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--green); color: var(--on-green); opacity: 0; pointer-events: none; transition: opacity .5s; }
#splash.show { opacity: 1; pointer-events: auto; transition: none; }
#splash .wordmark { color: var(--on-green); font-size: 56px; }
#splash small { font: 500 12px/1 var(--serif); letter-spacing: .5em; color: color-mix(in srgb, var(--on-green) 70%, transparent); padding-inline-start: .5em; }
#splash p { margin-top: 36px; font-size: 13px; color: color-mix(in srgb, var(--on-green) 75%, transparent); }

/* helpers */
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.col { display: flex; flex-direction: column; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.ltr { direction: ltr; unicode-bidi: plaintext; }
.center { text-align: center; }
.block { display: block; }
.strike { text-decoration: line-through; color: var(--muted); }
.pos { color: var(--green-soft); }
.neg { color: var(--danger); }
.small { font-size: 12px; }
.muted { color: var(--muted); }
.big { font-size: 30px; font-weight: 800; letter-spacing: -.01em; color: var(--green); }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* toast */
#toast { position: fixed; z-index: 9999; bottom: 92px; left: 50%; transform: translate(-50%, 8px); max-width: calc(100% - 40px); padding: 11px 18px; border-radius: 999px; background: var(--green-deep); color: var(--on-green); font-weight: 600; font-size: 13px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); display: flex; gap: 12px; align-items: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
#toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
#toast button { color: #d8c89a; font-weight: 700; }

/* ---- text blocks ---- */
.greet h1 { font-size: 24px; font-weight: 800; color: var(--green); line-height: 1.4; }
.greet p { color: var(--muted); font-size: 13px; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; align-items: center; justify-content: space-between; }
.section-head h3 { font-size: 16px; font-weight: 800; color: var(--ink); }
.eyebrow { display: block; font-size: 11px; letter-spacing: .08em; color: color-mix(in srgb, var(--on-green) 70%, transparent); }
.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 16px 0; }
.link { font-size: 12.5px; font-weight: 700; color: var(--green-soft); padding: 4px 2px; }
.link.center { display: block; width: 100%; text-align: center; padding: 10px; }

/* ---- hero card ---- */
.hero { position: relative; overflow: hidden; background: var(--green); color: var(--on-green); border-radius: var(--r-lg); padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.hero h2 { font-size: 21px; font-weight: 700; line-height: 1.5; max-width: 80%; }
.hero small { color: color-mix(in srgb, var(--on-green) 70%, transparent); }
.leaf { position: absolute; inset-inline-end: -6px; top: -4px; width: 96px; color: var(--on-green); opacity: .16; pointer-events: none; }
.glance { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 6px; border-top: 1px solid color-mix(in srgb, var(--on-green) 18%, transparent); padding-top: 14px; }
.glance.two { grid-template-columns: 1fr 1fr; }
.glance-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.glance-cell + .glance-cell { border-inline-start: 1px solid color-mix(in srgb, var(--on-green) 18%, transparent); }
.glance-cell b { font-size: 20px; font-weight: 800; }
.balance { display: flex; align-items: baseline; gap: 8px; }
.balance b { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.balance span { font-size: 18px; opacity: .75; }
.weight { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
.weight-value { display: flex; flex-direction: column; align-items: center; }
.weight-value b { font-size: 46px; font-weight: 800; line-height: 1.1; }

/* ---- buttons ---- */
.round { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--green); color: var(--on-green); }
.round.ghost-light { background: color-mix(in srgb, var(--on-green) 14%, transparent); width: 38px; height: 38px; }
.round:active { transform: scale(.94); }
.actions { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 16px; border-radius: 999px; background: var(--green); color: var(--on-green); font-weight: 700; font-size: 14px; text-align: center; }
.btn.ghost { background: transparent; color: var(--green); box-shadow: inset 0 0 0 1.5px var(--green); }
.btn:active { transform: scale(.98); }
.btn .material-symbols-outlined { font-size: 20px; }
.pill { padding: 6px 14px; border-radius: 999px; background: var(--green); color: var(--on-green); font-size: 12px; font-weight: 700; white-space: nowrap; }
.chip-info { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--sage) 35%, transparent); color: var(--green); font-weight: 700; }

/* ---- lists ---- */
.list-plain { display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.list-plain:empty { display: none; }
.row-item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; width: 100%; text-align: start; background: var(--paper); }
.row-item + .row-item, .row-item + .link, .link + .row-item, .list-plain > p + .row-item, .link + .link { border-top: 1px solid var(--line); }
.row-item b { font-weight: 700; white-space: nowrap; }
.thumb { width: 38px; height: 38px; border-radius: 12px; flex: none; display: grid; place-items: center; background: color-mix(in srgb, var(--sage) 30%, transparent); color: var(--green); overflow: hidden; }
.thumb .material-symbols-outlined { font-size: 20px; }
img.thumb, .meal img { width: 38px; height: 38px; border-radius: 12px; object-fit: cover; flex: none; }
.list-plain > .link { padding: 12px; }

.add-line { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 16px; padding-inline-start: 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; }
.add-line input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 15px; padding: 8px 0; }
.add-line input::placeholder { color: var(--muted); }
.add-line .round { width: 40px; height: 40px; }

.check { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--green-soft); color: transparent; background: transparent; }
.check .material-symbols-outlined { font-size: 16px; }
.check.on { background: var(--green); border-color: var(--green); color: var(--on-green); }
.task-text { font-size: 15px; font-weight: 600; text-align: start; }
.task-text small { font-weight: 400; }
.task.is-done .task-text > span { text-decoration: line-through; color: var(--muted); }

.habit-row { display: flex; gap: 14px; overflow-x: auto; padding: 2px 2px 8px; }
.habit { flex: none; width: 78px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.habit small { max-width: 100%; color: var(--ink); font-weight: 600; }
.habit b { font-size: 11px; color: var(--muted); font-weight: 600; }
.habit-circle { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; color: var(--green); background: conic-gradient(var(--green) calc(var(--p) * 1%), var(--line) 0); position: relative; }
.habit-circle::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--paper); }
.habit-circle .material-symbols-outlined { position: relative; font-size: 26px; }
.habit.ok .habit-circle { color: var(--on-green); }
.habit.ok .habit-circle::before { background: var(--green); }

/* ---- gym ---- */
.bar-card { background: var(--green); color: var(--on-green); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.bar-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; color: var(--on-green); }
.bar-head small { color: color-mix(in srgb, var(--on-green) 70%, transparent); }
.bar-head b { font-size: 15px; }
.bar-icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--on-green) 14%, transparent); }
.bar-head .chev { transition: transform .2s; }
.bar-card.open .chev { transform: rotate(180deg); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 4px 10px 16px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; color: var(--on-green); }
.day small { color: color-mix(in srgb, var(--on-green) 70%, transparent); font-size: 9.5px; max-width: 100%; }
.day-circle { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: color-mix(in srgb, var(--on-green) 12%, transparent); }
.day.now .day-circle { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--on-green) 60%, transparent); }
.day.on .day-circle { background: var(--on-green); color: var(--green); }
.progress-line { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; }
.bar { display: block; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; background: var(--green); transition: width .3s; }
.bar.over i { background: var(--danger); }
.exercise { display: flex; flex-direction: column; gap: 10px; padding: 13px 14px; background: var(--paper); }
.exercise + .exercise { border-top: 1px solid var(--line); }
.ex-text > span { font-size: 15px; font-weight: 700; }
.sets { display: flex; flex-wrap: wrap; gap: 8px; }
.set { min-width: 42px; height: 36px; border-radius: 999px; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--green); border: 1.5px solid var(--sage); }
.set.on { background: var(--green); border-color: var(--green); color: var(--on-green); }
.cal-card { display: flex; flex-direction: column; gap: 10px; padding: 16px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); }
.cal-card .big { font-size: 28px; }
.meal b { color: var(--green); }

/* ---- bottom sheets (shared by every dialog) ---- */
.overlay { position: fixed; inset: 0; z-index: 9000; display: flex; align-items: flex-end; justify-content: center; background: rgba(32, 40, 30, .45); opacity: 0; transition: opacity .2s; }
.overlay.open { opacity: 1; }
.sheet { width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 10px 20px calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--paper); color: var(--ink); border-radius: 24px 24px 0 0; transform: translateY(30px); transition: transform .22s; }
.overlay.open .sheet { transform: none; }
.sheet-grip { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 2px auto 14px; }
.sheet h3 { margin: 0 0 4px; font-size: 18px; font-weight: 800; color: var(--green); }
.sheet-sub { margin: 0 0 12px; font-size: 12px; color: var(--muted); line-height: 1.8; }
.sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
.sheet .btn { flex: 1; background: var(--cream); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.sheet .btn.primary { background: var(--green); color: var(--on-green); box-shadow: none; }
.sheet .btn.danger { color: var(--danger); }
.field { display: block; margin: 12px 0; }
.field > span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--cream); color: var(--ink); font: 500 15px var(--font); outline: none; direction: rtl; }
.input:focus { border-color: var(--green); }
.input-ltr { direction: ltr; text-align: right; }
textarea.input { min-height: 110px; resize: vertical; line-height: 1.8; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; gap: 5px; align-items: center; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--cream); font-weight: 600; font-size: 13px; }
.chip.on { background: var(--green); border-color: var(--green); color: var(--on-green); }
.chip .material-symbols-outlined { font-size: 17px; }
.switch { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; font-size: 14px; font-weight: 600; cursor: pointer; }
.switch i { width: 44px; height: 26px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.switch i::after { content: ''; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch.on i { background: var(--green); }
.switch.on i::after { transform: translateX(-18px); }
.menu { display: flex; flex-direction: column; margin-top: 6px; }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 4px; font-weight: 600; font-size: 15px; }
.menu button + button { border-top: 1px solid var(--line); }
.menu button .material-symbols-outlined { color: var(--green-soft); }
.menu button.danger, .menu button.danger .material-symbols-outlined { color: var(--danger); }
.list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; background: var(--cream); border-radius: var(--r-md); font-size: 14px; }
.item[role="button"] { cursor: pointer; }
.item-block { display: block; }
.item-icon { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--sage) 30%, transparent); flex: none; color: var(--green); }
.item-icon .material-symbols-outlined { font-size: 19px; }
.item-icon.num { font-weight: 800; font-size: 13px; }
.item-title { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-sub { display: block; font-size: 11.5px; color: var(--muted); }
.amt { direction: ltr; font-weight: 800; white-space: nowrap; }
.group-label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 4px 2px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.stat-grid > div { background: var(--cream); border-radius: var(--r-md); padding: 10px 12px; }
.stat-grid small { display: block; }
.stat-grid b { font-size: 16px; }
.progress { display: block; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 6px; }
.progress i { display: block; height: 100%; border-radius: 6px; background: var(--green); }
.sheet .small { font-size: 12px; }
.sheet .pos { color: var(--green-soft); }
.sheet .bar { height: 6px; }

/* Page-specific tweaks live here; most styling is shared in components.css. */
.page-money .balance b { font-size: 38px; }

  </style>

const WINDOW_MIN = 30; // fire if we are at most this late

function dueReminder() {
  if (S.wallet.lastDueNotice === today()) return;
  const items = dueItems(1).filter((d) => d.ref.remind !== false);
  if (!items.length) return;
  const over = items.filter((d) => d.due < today()).length;
  S.wallet.lastDueNotice = today();
  persist();
  const soon = items.length - over;
  const msg = over
    ? `${fa(over)} پرداخت معوق دارید${soon ? ` و ${fa(soon)} سررسید امروز/فردا` : ''}`
    : `${fa(items.length)} سررسید قسط/قبض برای امروز یا فردا`;
  setTimeout(() => notify(msg), 1200);
}

function checkReminders() {
  try { dueReminder(); } catch (e) { console.error(e); }
  const d = today();
  const now = hmToMin(nowHM());
  let changed = false;
  const late = (hm) => hmToMin(hm) <= now && now - hmToMin(hm) < WINDOW_MIN;

  S.tasks.forEach((t) => {
    if (t.reminder && !t.done && !t.notified && t.date === d && t.time && late(t.time)) { t.notified = true; changed = true; notify(`یادآوری: ${t.title}`); }
  });
  if (changed) persist();
}

const { toast } = __r("src/ui/toast.js");
const { cap } = __r("src/services/ai.js");

/** Save text through the host's download capability when present, else an <a download>. */
async function saveFile(filename, data, mime, doneMsg = 'فایل آماده شد') {
  const host = await cap('downloads');
  if (host) {
    try { await host.save({ filename, data }); toast(doneMsg); } catch { toast('ذخیره فایل لغو شد'); }
    return;
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type: mime }));
    a.download = filename;
    document.body.appendChild(a);

    a.remove();
    toast('فایل دانلود شد');
  } catch { toast('دانلود در این محیط ممکن نیست'); }

function pickFile(accept, capture, cb) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = accept;
  if (capture) input.setAttribute('capture', 'environment');
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = () => { const f = input.files && input.files[0]; input.remove(); if (f) cb(f); };
  input.click();
}

/** Downscale an image file to a small JPEG data URL (null on failure). */
function shrinkImage(file, max, cb) {
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * k);
    canvas.height = Math.round(img.height * k);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    cb(canvas.toDataURL('image/jpeg', 0.7));
  };
  img.onerror = () => { URL.revokeObjectURL(url); cb(null); };
  img.src = url;
}

/** Promise flavour of shrinkImage: resolves a JPEG data URL, or null on failure. */
const shrinkImageAsync = (file, max) => new Promise((resolve) => shrinkImage(file, max, resolve));

      const amount = num(v.amount);
      const count = Math.round(num(v.count));
      if (!title) { toast('عنوان را وارد کنید'); return false; }
      if (amount <= 0) { toast('مبلغ قسط را وارد کنید'); return false; }
      if (count < 1 || count > 600) { toast('تعداد اقساط معتبر نیست'); return false; }
      fin.saveLoan(l, { title, lender: (v.lender || '').trim(), amount, count, start: v.start || today(), every: +v.every || 1, accountId: v.acc, remind: !!v.remind, paidBefore: Math.round(num(v.paidBefore)) });
      commit();
      toast(l ? 'قسط ویرایش شد' : `قسط «${title}» ثبت شد`);
    },
  });
}

function confirmDeleteLoan(l) {
  const linked = S.tx.filter((t) => t.loanId === l.id).length;
  confirmBox(`حذف «${l.title}»؟`, linked ? `${fa(linked)} تراکنش پرداخت‌شده در دفتر باقی می‌ماند.` : 'برنامه اقساط حذف می‌شود.', 'حذف', () => {
    fin.deleteLoan(l);
    commit();
    toast('حذف شد');
  });
}

function loanSchedule(l) {
  const tile = (label, value, cls = '') => `<div><small>${label}</small><b class="${cls}">${value}</b></div>`;
  let html = `<div class="stat-grid">${tile('پرداخت‌شده', `${fa(fin.loanPaidCount(l))} از ${fa(l.count)}`)}${tile('مانده بدهی', M(fin.loanRemaining(l)), 'neg')}${tile('مبلغ کل', M(l.amount * l.count))}${tile('آخرین سررسید', monthYear(fin.loanDue(l, l.count)))}</div><div class="list">`;
  for (let n = 1; n <= l.count; n++) {
    const due = fin.loanDue(l, n);
    const p = l.paid[n];
    const over = !p && due < today();
    const state = p ? `پرداخت شد${p.before ? ' (قبل از ثبت)' : ` • ${faDayMonth(parseIso(p.date))}`}` : over ? `معوق — ${relDay(due)}` : relDay(due);
    html += `<div class="item" data-pick="${n}" role="button"><span class="item-icon num">${fa(n)}</span>
      <span class="grow"><span class="item-title">${fullDate(due)}</span><span class="item-sub${over ? ' neg' : ''}">${state}</span></span>
      <b class="amt${p ? ' pos' : ''}">${p ? (p.settled ? 'تسویه ✓' : `✓ ${M(p.amount)}`) : M(l.amount)}</b></div>`;
  }
  infoSheet(l.title, `${html}</div>`, [{ label: 'ویرایش', run: () => loanSheet(l.id) }], (el, close) => {
    const n = +el.dataset.pick;
    close();
    later(() => (l.paid[n] ? undoPayment(l, n) : payLoan(l, n)));
  });
}

function loanMenu(l) {
  const nx = fin.loanNextN(l);
  menu(l.title, [
    nx && { icon: 'payments', label: `پرداخت قسط ${fa(nx)} (${fullDate(fin.loanDue(l, nx))})`, run: () => payLoan(l, nx) },
    { icon: 'calendar_month', label: 'جدول کامل اقساط', run: () => loanSchedule(l) },
    nx && { icon: 'done_all', label: 'تسویه کامل (پرداخت همه اقساط باقی‌مانده)', run: () => settleSheet(l) },
    { icon: 'edit', label: 'ویرایش', run: () => loanSheet(l.id) },
    { icon: 'delete', label: 'حذف', danger: true, run: () => confirmDeleteLoan(l) },
  ], `${l.lender ? `${l.lender} • ` : ''}مانده: ${M(fin.loanRemaining(l))}`);
}

function settleSheet(l) {
  const rem = fin.loanRemaining(l);
  form({
    title: `تسویه کامل ${l.title}`,
    sub: `${fa(l.count - fin.loanPaidCount(l))} قسط باقی‌مانده به مبلغ ${M(rem)}. اگر تخفیف تسویه گرفته‌اید مبلغ را اصلاح کنید.`,
    fields: [{ name: 'amount', label: 'مبلغ پرداختی', type: 'number', value: rem }, { name: 'date', label: 'تاریخ', type: 'date', value: today() }],
    submit: 'تسویه',
    onSubmit(v) {
      const amount = num(v.amount);
      if (amount <= 0) { toast('مبلغ را وارد کنید'); return false; }
      fin.settleLoan(l, amount, v.date);
      commit();
      toast(`🎉 «${l.title}» تسویه شد`);
    },
  });
}

/* ---------- bills ---------- */
function billSheet(id) {
  const b = id ? S.bills.find((x) => x.id === id) : null;
  const autoTitle = (kind) => `قبض ${fin.BILL_KINDS[kind].label}`;
  const fields = [
    {
      name: 'kind', label: 'نوع', type: 'chips', value: b ? b.kind : 'electricity',
      options: Object.entries(fin.BILL_KINDS).map(([k, v]) => ({ value: k, label: v.label, icon: v.icon })),
      onChange(kind, f) {
        const input = f.querySelector('input[name=title]');
        const isAuto = Object.keys(fin.BILL_KINDS).some((k) => input && input.value === autoTitle(k));
        if (input && (!input.value || isAuto)) { input.value = autoTitle(kind); input.dispatchEvent(new Event('input')); }
      },
    },
    { name: 'title', label: 'عنوان', value: b ? b.title : 'قبض برق' },
    { name: 'amount', label: 'مبلغ تقریبی هر دوره', type: 'number', value: b ? b.amount : '', row: 'a' },
    { name: 'start', label: 'سررسید بعدی', type: 'date', value: b ? b.start : addMonthsIso(today(), 0), row: 'a' },
    { name: 'every', label: 'دوره پرداخت', type: 'chips', value: String(b ? b.every || 1 : 1), options: Object.entries(fin.EVERY).map(([k, label]) => ({ value: k, label })) },
  ];
  if (S.accounts.length > 1) fields.push({ name: 'acc', label: 'پرداخت معمولاً از حساب', type: 'chips', value: b ? b.accountId || fin.defAcc() : fin.defAcc(), options: accOptions() });
  fields.push({ name: 'remind', label: 'یادآوری سررسید (یک روز قبل)', type: 'switch', value: b ? b.remind !== false : true });
  form({
    title: b ? 'ویرایش قبض' : 'قبض یا پرداخت دوره‌ای جدید',
    sub: 'مثل برق، گاز، اینترنت، اجاره، بیمه یا اشتراک‌ها.', fields, focus: false,
    extra: b ? [{ label: 'حذف', cls: 'danger', run: () => confirmDeleteBill(b) }] : [],
    onSubmit(v) {
      const title = (v.title || '').trim();
      if (!title) { toast('عنوان را وارد کنید'); return false; }
      fin.saveBill(b, { kind: v.kind, title, amount: num(v.amount), every: +v.every || 1, start: v.start || today(), accountId: v.acc, remind: !!v.remind });
      commit();

    },
  });
}

function confirmDeleteBill(b) {
  confirmBox(`حذف «${b.title}»؟`, 'تراکنش‌های پرداخت‌شده در دفتر باقی می‌مانند.', 'حذف', () => { fin.deleteBill(b); commit(); toast('حذف شد'); });

function billMenu(b) {

  const keys = Object.keys(b.paid).sort().reverse();

function deleteAccountFlow(a) {
  if (fin.accountInUse(a)) { toast('این حساب تراکنش دارد؛ اول تراکنش‌ها را به حساب دیگری منتقل یا حذف کنید'); return; }
  confirmBox(`حذف «${a.name}»؟`, 'این حساب تراکنشی ندارد.', 'حذف', () => { S.accounts.splice(S.accounts.indexOf(a), 1); commit(); });

function accountMenu(a) {
  menu(a.name, [
    { icon: 'receipt_long', label: 'تراکنش‌های این حساب', run: () => historySheet((t) => fin.txAccount(t) === a.id || t.toAccountId === a.id, `تراکنش‌های ${a.name}`) },

    { icon: 'tune', label: 'اصلاح موجودی (تطبیق با بانک)', run: () => reconcileSheet(a) },
    { icon: 'edit', label: 'ویرایش', run: () => accountSheet(a.id) },
  ], `${fin.accType(a).label} • موجودی: ${M(fin.accBalance(a.id))}`);
}

function reconcileSheet(a) {
  const cur = fin.accBalance(a.id);
  form({
    title: `تطبیق موجودی ${a.name}`,
    sub: `موجودی فعلی در برنامه: ${M(cur)}. موجودی واقعی حساب را وارد کنید؛ اختلاف به‌صورت تراکنش «اصلاح موجودی» ثبت می‌شود.`,
    fields: [{ name: 'real', label: 'موجودی واقعی', type: 'number', value: Math.round(cur * 100) / 100 }],
    submit: 'تطبیق',
    onSubmit(v) {
      if (!fin.reconcileAccount(a, num(v.real))) { toast('موجودی از قبل درست است'); return; }
      commit();
      toast('موجودی تطبیق داده شد');
    },
  });

/* ---------- one-tap payment (used by the "due soon" list) ---------- */
/** Pay a due item at its usual amount today and record the expense; the toast offers undo. */
function payNow(it) {
  fin.payObligation(it, { amount: it.amount, date: today(), accountId: it.ref.accountId, record: true });
  const key = it.kind === 'loan' ? it.n : it.due;
  commit();
  toast(`«${it.title}» پرداخت شد`, { label: 'واگرد', run: () => { fin.cancelPayment(it.ref, key); commit(); } });

/* ---------- management lives behind one entry ---------- */
function listSheet(title, rows, addLabel, onAdd, onPick) {
  const html = rows.length
    ? `<div class="list">${rows.map((r) => `<div class="item" data-pick="${r.id}" role="button"><span class="grow"><span class="item-title">${esc(r.title)}</span><span class="item-sub">${r.sub}</span></span><b class="amt">${r.amount}</b></div>`).join('')}</div>`
    : '<div class="empty">هنوز چیزی ثبت نشده</div>';
  infoSheet(title, html, [{ label: addLabel, cls: 'primary', run: onAdd }], (el, close) => { close(); later(() => onPick(el.dataset.pick)); });
}

function manageMenu() {
  menu('قسط، قبض و حساب‌ها', [
    {
      icon: 'event_repeat', label: 'اقساط و وام‌ها',
      run: () => listSheet('اقساط و وام‌ها', S.loans.map((l) => ({ id: l.id, title: l.title, sub: `${fa(fin.loanPaidCount(l))} از ${fa(l.count)} پرداخت شد`, amount: M(fin.loanRemaining(l)) })), 'قسط جدید', () => loanSheet(), (id) => loanMenu(S.loans.find((l) => l.id === id))),

      run: () => listSheet('قبض‌ها', S.bills.map((b) => ({ id: b.id, title: b.title, sub: `${fin.billKind(b).label} • ${fin.EVERY[b.every || 1]}${b.paused ? ' • متوقف' : ''}`, amount: M(fin.billAvg(b)) })), 'قبض جدید', () => billSheet(), (id) => billMenu(S.bills.find((b) => b.id === id))),
    },
    {
      icon: 'account_balance', label: 'حساب‌ها و کارت‌ها',
      run: () => listSheet('حساب‌ها', S.accounts.map((a) => ({ id: a.id, title: a.name, sub: fin.accType(a).label, amount: M(fin.accBalance(a.id)) })), 'حساب جدید', () => accountSheet(), (id) => accountMenu(fin.findAccount(id))),
    },
    { icon: 'swap_horiz', label: 'انتقال بین حساب‌ها', run: () => transferSheet() },

  ]);
}
